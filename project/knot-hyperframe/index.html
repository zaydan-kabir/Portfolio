<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Knot HyperFrame Preview</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #root { width: 100vw; height: 100vh; display: block; }
  #root canvas { display: block; width: 100% !important; height: 100% !important; }
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "@paper-design/shaders-react": "https://esm.sh/@paper-design/shaders-react?deps=react@18.3.1,react-dom@18.3.1&bundle"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React, { useState, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import { LiquidMetal } from '@paper-design/shaders-react';

    // Load the uploaded knot wordmark PNG, then color-key its white
    // background to transparent so the shader sees only the glyph.
    async function loadKnotWordmark() {
      const src = '../uploads/knot-wordmark.png';
      const img = await new Promise((resolve, reject) => {
        const i = new Image();
        i.crossOrigin = 'anonymous';
        i.onload = () => resolve(i);
        i.onerror = reject;
        i.src = src;
      });
      const w = img.naturalWidth, h = img.naturalHeight;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const data = ctx.getImageData(0, 0, w, h);
      const d = data.data;
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i + 1], b = d[i + 2];
        // Luminance: white/near-white becomes transparent, dark becomes
        // opaque black so the shader gets a clean SDF-friendly silhouette.
        const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
        const a = Math.max(0, Math.min(255, 255 - lum));
        d[i] = 0; d[i + 1] = 0; d[i + 2] = 0; d[i + 3] = a;
      }
      ctx.putImageData(data, 0, 0);
      return c.toDataURL('image/png');
    }

    function App() {
      const [size, setSize] = useState({
        w: window.innerWidth || 1280,
        h: window.innerHeight || 720
      });
      const [image, setImage] = useState(null);

      useEffect(() => {
        let alive = true;
        loadKnotWordmark()
          .then(url => { if (alive) setImage(url); })
          .catch(() => { if (alive) setImage(null); });
        const onResize = () => setSize({ w: window.innerWidth, h: window.innerHeight });
        window.addEventListener('resize', onResize);
        return () => { alive = false; window.removeEventListener('resize', onResize); };
      }, []);

      if (!image) return null;

      return React.createElement(LiquidMetal, {
        width: size.w,
        height: size.h,
        image,
        colorBack: '#000000',
        colorTint: '#ffffff',
        shape: undefined,
        repetition: 2.5,
        softness: 0.33,
        shiftRed: -0.2,
        shiftBlue: -0.14,
        distortion: 0.15,
        contour: 0.4,
        angle: 70,
        speed: 1,
        scale: 0.76,
        fit: 'contain'
      });
    }

    createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
