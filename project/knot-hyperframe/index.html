<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Knot HyperFrame Preview</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #root { width: 100vw; height: 100vh; display: block; }
  #root canvas { display: block; width: 100% !important; height: 100% !important; }
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "@paper-design/shaders-react": "https://esm.sh/@paper-design/shaders-react?deps=react@18.3.1,react-dom@18.3.1&bundle"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React, { useState, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import { LiquidMetal } from '@paper-design/shaders-react';

    function App() {
      const [size, setSize] = useState({
        w: window.innerWidth || 1280,
        h: window.innerHeight || 720
      });
      useEffect(() => {
        const onResize = () => setSize({ w: window.innerWidth, h: window.innerHeight });
        window.addEventListener('resize', onResize);
        return () => window.removeEventListener('resize', onResize);
      }, []);
      return React.createElement(LiquidMetal, {
        width: size.w,
        height: size.h,
        image: 'https://shaders.paper.design/images/logos/diamond.svg',
        colorBack: '#000000',
        colorTint: '#ffffff',
        shape: undefined,
        repetition: 2.5,
        softness: 0.33,
        shiftRed: -0.2,
        shiftBlue: -0.14,
        distortion: 0.15,
        contour: 0.4,
        angle: 70,
        speed: 1,
        scale: 0.76,
        fit: 'contain'
      });
    }

    createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
