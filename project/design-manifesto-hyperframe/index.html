<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design Manifesto HyperFrame Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=VT323&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f0f0f0; }

    [data-composition-id="design-manifesto-preview"] {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      color: #0a0a0a;
      font-family: 'Lora', Georgia, serif;
      background:
        linear-gradient(90deg, rgba(10,10,10,.035) 0 1px, transparent 1px 100%),
        linear-gradient(0deg, rgba(10,10,10,.028) 0 1px, transparent 1px 100%),
        radial-gradient(ellipse at 74% 76%, rgba(255,214,80,.18) 0%, transparent 28%),
        radial-gradient(ellipse at 22% 18%, rgba(217,121,87,.12) 0%, transparent 34%),
        #f0f0f0;
      background-size: 34px 34px, 34px 34px, auto, auto, auto;
      isolation: isolate;
    }

    .page {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      padding: clamp(30px, 5vw, 76px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: clamp(10px, 2.2vw, 26px);
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      color: rgba(10,10,10,.42);
      font-family: 'VT323', 'Courier New', monospace;
      font-size: clamp(13px, 1.25vw, 18px);
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .topline::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(10,10,10,.18);
      transform-origin: left center;
    }

    .text-field {
      position: relative;
      width: min(940px, 86vw);
      margin: auto;
      min-height: min(66vh, 620px);
      display: grid;
      place-items: center;
      padding: clamp(22px, 4vw, 54px);
    }

    .text-field::before {
      content: '';
      position: absolute;
      inset: 8%;
      border: 1px solid rgba(10,10,10,.08);
      border-radius: 50%;
      transform: rotate(-7deg) scaleX(1.28);
      opacity: .9;
    }

    .flow {
      position: relative;
      width: 100%;
      max-width: 830px;
      color: rgba(10,10,10,.86);
      text-align: center;
      font-style: italic;
      font-size: clamp(14px, 1.72vw, 24px);
      line-height: 1.4;
    }

    .flow span {
      display: inline-block;
      margin: 0 .14em;
      will-change: transform, opacity;
    }

    .flow .warm { color: #d97957; }
    .flow .muted { color: #52666a; }

    .caption {
      justify-self: center;
      color: rgba(10,10,10,.62);
      font-family: 'VT323', 'Courier New', monospace;
      font-size: clamp(12px, 1.15vw, 16px);
      letter-spacing: .18em;
      text-transform: uppercase;
      will-change: transform, opacity;
    }

    .fig {
      position: absolute;
      right: clamp(22px, 5vw, 72px);
      bottom: clamp(46px, 7vw, 104px);
      width: clamp(58px, 8.2vw, 116px);
      height: auto;
      z-index: 7;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,.28));
      transform-origin: 54% 56%;
      will-change: transform, opacity, filter;
    }

    .bee {
      position: absolute;
      left: 50%;
      top: 50%;
      width: clamp(42px, 5.7vw, 82px);
      height: clamp(42px, 5.7vw, 82px);
      z-index: 9;
      pointer-events: none;
      filter: drop-shadow(0 12px 20px rgba(0,0,0,.3));
      transform-origin: 50% 50%;
      will-change: transform, opacity, filter;
    }

    .cursor-dot {
      position: absolute;
      left: 23%;
      top: 54%;
      width: clamp(7px, .9vw, 12px);
      height: clamp(7px, .9vw, 12px);
      border-radius: 50%;
      background: #0a0a0a;
      z-index: 8;
      will-change: transform, opacity;
    }

    .trace {
      position: absolute;
      left: 23%;
      top: 54%;
      width: clamp(120px, 24vw, 340px);
      height: clamp(42px, 8vw, 90px);
      z-index: 6;
      opacity: .52;
      overflow: visible;
    }

    .trace path {
      fill: none;
      stroke: rgba(10,10,10,.4);
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-dasharray: 440;
      stroke-dashoffset: 440;
      vector-effect: non-scaling-stroke;
    }

    .edge-word {
      position: absolute;
      left: clamp(16px, 3vw, 42px);
      bottom: clamp(12px, 2.5vw, 34px);
      z-index: 2;
      color: rgba(10,10,10,.13);
      font-family: 'VT323', 'Courier New', monospace;
      font-size: clamp(70px, 13vw, 185px);
      line-height: .7;
      letter-spacing: .06em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .grain {
      position: absolute;
      inset: 0;
      z-index: 20;
      opacity: .12;
      mix-blend-mode: multiply;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
      background-size: 180px 180px;
    }

    @media (max-aspect-ratio: 1/1) {
      .page { padding: clamp(22px, 6vw, 42px); }
      .text-field { width: 100%; min-height: 70vh; padding: 18px; }
      .flow { font-size: clamp(13px, 4vw, 20px); line-height: 1.34; }
      .fig { width: clamp(58px, 18vw, 88px); right: 24px; bottom: 74px; }
      .bee { width: clamp(42px, 14vw, 64px); height: clamp(42px, 14vw, 64px); }
    }
  </style>
</head>
<body>
  <div data-composition-id="design-manifesto-preview" data-width="1280" data-height="982" data-duration="12" data-start="0" data-track-index="0">
    <div class="page">
      <div class="topline"><span>Design Manifesto</span></div>
      <section class="text-field" aria-hidden="true">
        <p class="flow">
          <span>During</span><span>my</span><span>years</span><span>at</span><span>Stanford,</span><span>I</span><span>often</span><span>returned</span><span>to</span><span>Sylvia</span><span>Plath&rsquo;s</span><span class="warm">fig</span><span>tree.</span>
          <span>Distance</span><span>has</span><span>a</span><span>way</span><span>of</span><span>clarifying</span><span>what</span><span>familiarity</span><span>obscures.</span>
          <span>Design,</span><span>however,</span><span>emerged</span><span>as</span><span>something</span><span>more</span><span>than</span><span>an</span><span>interest.</span>
          <span>It</span><span>felt</span><span>like</span><span>a</span><span class="muted">mode</span><span class="muted">of</span><span class="muted">attention,</span><span>a</span><span>way</span><span>of</span><span>looking</span><span>closely</span><span>enough.</span>
          <span>To</span><span>create,</span><span>and</span><span>not</span><span>just</span><span>consume.</span>
        </p>
      </section>
      <div class="caption">meaning in the everyday</div>
    </div>

    <svg class="trace" viewBox="0 0 340 90" focusable="false" aria-hidden="true">
      <path d="M4 58 C64 10 116 106 174 48 C218 3 264 72 336 20"></path>
    </svg>
    <span class="cursor-dot" aria-hidden="true"></span>
    <img class="fig" src="../uploads/Uncut%20Fig%201.png" alt="" aria-hidden="true">
    <img class="bee" src="../uploads/bee-cursor.png" alt="" aria-hidden="true">
    <div class="edge-word" aria-hidden="true">fig</div>
    <div class="grain"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from('.topline span', {
        y: 14,
        opacity: 0,
        duration: 0.55,
        ease: 'power3.out',
        immediateRender: false
      }, 0.16);

      tl.from('.topline', {
        scaleX: 0.72,
        duration: 0.7,
        ease: 'expo.out',
        transformOrigin: 'left center',
        immediateRender: false
      }, 0.2);

      tl.from('.text-field', {
        y: 18,
        opacity: 0,
        duration: 0.78,
        ease: 'power3.out',
        immediateRender: false
      }, 0.26);

      tl.from('.flow span', {
        opacity: 0,
        y: 16,
        rotation: -2,
        duration: 0.58,
        ease: 'power3.out',
        stagger: 0.018,
        immediateRender: false
      }, 0.58);

      tl.from('.fig', {
        scale: 0.72,
        opacity: 0,
        y: 16,
        duration: 0.7,
        ease: 'back.out(1.8)',
        immediateRender: false
      }, 1.55);

      tl.from('.caption', {
        y: 12,
        opacity: 0,
        duration: 0.5,
        ease: 'power2.out',
        immediateRender: false
      }, 1.8);

      tl.from('.edge-word', {
        y: 28,
        opacity: 0,
        duration: 0.76,
        ease: 'power2.out',
        immediateRender: false
      }, 1.95);

      tl.from('.cursor-dot', {
        scale: 0,
        opacity: 0,
        duration: 0.34,
        ease: 'back.out(2.4)',
        immediateRender: false
      }, 2.18);

      tl.to('.trace path', {
        strokeDashoffset: 0,
        duration: 1.0,
        ease: 'power2.out'
      }, 2.3);

      tl.to('.flow span', {
        x: (index) => Math.sin(index * 1.7) * 9,
        y: (index) => Math.cos(index * 1.15) * 7,
        rotation: (index) => Math.sin(index * .82) * 2.6,
        duration: 1.7,
        ease: 'sine.inOut',
        stagger: 0.006
      }, 2.45);

      tl.fromTo('.bee', {
        xPercent: -50,
        yPercent: -50,
        x: '-58vw',
        y: '18vh',
        rotation: -8,
        scaleX: 1,
        opacity: 0
      }, {
        x: '-12vw',
        y: '2vh',
        rotation: -4,
        opacity: 1,
        duration: 1.05,
        ease: 'power3.out'
      }, 3.05);

      tl.to('.cursor-dot', {
        opacity: 0,
        scale: 0.4,
        duration: 0.32,
        ease: 'power2.out'
      }, 3.28);

      tl.to('.trace', {
        opacity: 0,
        duration: 0.42,
        ease: 'power2.out'
      }, 3.36);

      tl.to('.bee', {
        x: '19vw',
        y: '-4vh',
        rotation: 8,
        scaleX: -1,
        duration: 1.25,
        ease: 'sine.inOut'
      }, 4.05);

      tl.to('.bee', {
        x: '31vw',
        y: '18vh',
        rotation: -34,
        scaleX: -1,
        duration: 1.05,
        ease: 'sine.inOut'
      }, 5.12);

      tl.to('.fig', {
        filter: 'drop-shadow(0 0 10px rgba(255,255,210,.48)) drop-shadow(0 12px 24px rgba(0,0,0,.3))',
        scale: 1.05,
        duration: 0.74,
        ease: 'sine.inOut'
      }, 5.7);

      tl.to('.bee', {
        x: '34vw',
        y: '24vh',
        rotation: -8,
        scale: 0.82,
        scaleX: -0.82,
        duration: 0.82,
        ease: 'power3.out'
      }, 6.08);

      tl.to('.bee', {
        filter: 'drop-shadow(0 0 8px rgba(255,255,210,.9)) drop-shadow(0 0 20px rgba(255,214,80,.72)) drop-shadow(0 0 34px rgba(255,184,46,.42)) drop-shadow(0 8px 16px rgba(0,0,0,.3))',
        duration: 0.6,
        ease: 'sine.inOut'
      }, 6.42);

      tl.to('.fig', {
        filter: 'drop-shadow(0 0 16px rgba(255,232,130,.56)) drop-shadow(0 12px 24px rgba(0,0,0,.3))',
        duration: 0.9,
        yoyo: true,
        repeat: 3,
        ease: 'sine.inOut'
      }, 6.5);

      tl.to('.flow span', {
        x: (index) => Math.sin(index * .9) * 5,
        y: (index) => Math.cos(index * .7) * 4,
        rotation: (index) => Math.sin(index * .45) * 1.5,
        duration: 2.6,
        ease: 'sine.inOut'
      }, 7.1);

      tl.to('.text-field', {
        y: -4,
        duration: 2.8,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: 1
      }, 7.25);

      tl.to('.edge-word', {
        x: 18,
        opacity: .22,
        duration: 2.8,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: 1
      }, 7.3);

      window.__timelines['design-manifesto-preview'] = tl;

      if (!window.__hyperframes) {
        tl.eventCallback('onComplete', () => tl.restart());
        tl.play(0);
      }
    </script>
  </div>
</body>
</html>
