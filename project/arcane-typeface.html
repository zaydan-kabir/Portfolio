<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcane — Typeface Specimen</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: #000;
      color: #d8d3c4;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      -webkit-font-smoothing: antialiased;
    }
    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% 24%, #1e1e20 0%, #0a0a0a 60%, #000 100%);
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.10;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 220px 220px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 28px;
      border-bottom: 1px solid rgba(216, 211, 196, 0.14);
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      gap: 16px;
      flex-wrap: wrap;
    }
    header .title {
      font-size: 11px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #d8d3c4;
    }
    header .title .sub {
      color: rgba(216, 211, 196, 0.45);
      margin-left: 12px;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 18px;
      border: 1px solid rgba(216, 211, 196, 0.5);
      color: #d8d3c4;
      background: transparent;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.18s, color 0.18s, border-color 0.18s;
      position: relative;
    }
    .btn::before {
      content: '';
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(216, 211, 196, 0.14);
      pointer-events: none;
    }
    .btn:hover {
      background: #d8d3c4;
      color: #0a0a0a;
      border-color: #d8d3c4;
    }
    .btn:hover::before { border-color: rgba(10, 10, 10, 0.18); }
    .btn .ext { opacity: 0.55; font-size: 9px; }
    .btn.back { border-color: rgba(216, 211, 196, 0.22); color: rgba(216, 211, 196, 0.7); }
    .btn.back:hover { background: rgba(216, 211, 196, 0.08); color: #d8d3c4; border-color: rgba(216, 211, 196, 0.5); }

    /* Page is naturally scrollable. PDF block sized so the page fits the viewport (with toolbar) — user can see more without big scroll. */
    .pdf-wrap {
      position: relative;
      z-index: 1;
      padding: 20px clamp(16px, 4vw, 48px) 36px;
    }
    .pdf-iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 140px);
      min-height: 520px;
      max-height: 900px;
      border: 0;
      background: #2e2e30;
      box-shadow:
        0 24px 50px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(216, 211, 196, 0.10);
    }

    .fallback {
      position: relative;
      z-index: 1;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      padding: 80px 24px;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(216, 211, 196, 0.6);
    }

    footer {
      position: relative;
      z-index: 1;
      padding: 28px clamp(16px, 4vw, 48px) 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(216, 211, 196, 0.4);
      border-top: 1px solid rgba(216, 211, 196, 0.12);
    }

    @media (max-width: 640px) {
      header { padding: 12px 18px; }
      header .title { font-size: 10px; letter-spacing: 0.22em; }
      .btn { padding: 8px 14px; font-size: 9px; letter-spacing: 0.22em; }
      .pdf-iframe {
        height: calc(100vh - 180px);
        min-height: 480px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">
      Arcane — Typeface Specimen
      <span class="sub">v 0.1</span>
    </div>
    <div class="actions">
      <a class="btn" href="uploads/Arcane.otf?v=3" download="Arcane.otf">Download <span class="ext">.otf</span></a>
      <a class="btn" href="uploads/Arcane.ttf?v=3" download="Arcane.ttf">Download <span class="ext">.ttf</span></a>
      <a class="btn" href="uploads/Arcane-Specimen-v4.pdf" target="_blank" rel="noopener noreferrer">Open <span class="ext">.pdf</span></a>
      <a class="btn back" href="index.html">← Return</a>
    </div>
  </header>

  <section class="pdf-wrap">
    <iframe class="pdf-iframe"
            src="uploads/Arcane-Specimen-v4.pdf#view=FitH&toolbar=1"
            title="Arcane Typeface Specimen PDF"
            allowfullscreen></iframe>
    <div class="fallback" id="pdfFallback">
      <span>PDF preview isn't supported on this device.</span>
      <a class="btn" href="uploads/Arcane-Specimen-v4.pdf" target="_blank" rel="noopener noreferrer">Open PDF</a>
    </div>
  </section>

  <footer>
    <span>©2026 ZKA Studio</span>
    <span>Arcane · v 0.1 · open edition</span>
  </footer>

  <script>
    // iOS Safari can't render PDFs inline — show fallback link instead.
    (function () {
      var ua = navigator.userAgent || '';
      var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      if (isIOS) {
        var f = document.querySelector('.pdf-iframe');
        if (f) f.style.display = 'none';
        var fb = document.getElementById('pdfFallback');
        if (fb) fb.style.display = 'flex';
      }
    })();
  </script>
</body>
</html>
