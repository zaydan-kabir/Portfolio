<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interstellar Automata HyperFrame Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050608; }
    [data-composition-id="interstellar-automata-preview"] {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 52%, #11161f 0%, #080a0e 42%, #050608 78%);
      color: rgba(240,240,240,.78);
      font-family: 'Lora', Georgia, serif;
      isolation: isolate;
    }

    .stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .starfield {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: rgba(240,240,240,.78);
      box-shadow: 0 0 4px rgba(240,240,240,.4);
    }
    .star.dim { background: rgba(240,240,240,.36); box-shadow: none; }
    .star.tiny { width: 1px; height: 1px; }
    .star.warm { background: rgba(255,228,184,.7); box-shadow: 0 0 5px rgba(255,228,184,.4); }

    .mechanism {
      position: relative;
      width: min(72vmin, 560px);
      aspect-ratio: 1;
      z-index: 4;
    }

    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(240,240,240,.18);
      transform-origin: 50% 50%;
    }
    .ring.r1 { inset: 0; border-color: rgba(240,240,240,.22); }
    .ring.r2 { inset: 9%; border-color: rgba(240,240,240,.32); }
    .ring.r3 { inset: 21%; border-color: rgba(240,240,240,.46); border-style: dashed; }
    .ring.r4 { inset: 33%; border-color: rgba(180,210,255,.4); }

    .ticks {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
    }
    .tick {
      position: absolute;
      left: 50%;
      top: 0;
      width: 1px;
      height: 10px;
      background: rgba(240,240,240,.42);
      transform-origin: 50% calc(50vmin);
    }
    .tick.long { height: 16px; background: rgba(240,240,240,.7); }

    .ticks-outer .tick { transform-origin: 50% 280px; }
    .ticks-mid .tick { transform-origin: 50% 220px; height: 8px; background: rgba(240,240,240,.34); }

    .orbit-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(220,235,255,.92);
      box-shadow: 0 0 10px rgba(180,210,255,.7), 0 0 22px rgba(180,210,255,.32);
      transform: translate(-50%, -50%) translateY(-46%);
      z-index: 6;
    }

    .orbit-arm {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
      pointer-events: none;
    }

    .core {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 13.5%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 38% 36%, #fff5dd 0%, #ffe4b8 32%, #d3a76a 70%, #6c4a25 100%);
      box-shadow:
        0 0 22px rgba(255,228,184,.6),
        0 0 64px rgba(255,210,150,.32),
        0 0 140px rgba(255,196,128,.18);
      z-index: 5;
    }

    .core::after {
      content: '';
      position: absolute;
      inset: -34%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,228,184,.34) 0%, rgba(255,228,184,0) 62%);
      pointer-events: none;
    }

    .crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1px;
      height: 100%;
      background: linear-gradient(180deg, transparent 0%, rgba(240,240,240,.08) 12%, rgba(240,240,240,.18) 50%, rgba(240,240,240,.08) 88%, transparent 100%);
      transform: translate(-50%, -50%);
      z-index: 2;
    }
    .crosshair.h {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(240,240,240,.08) 12%, rgba(240,240,240,.18) 50%, rgba(240,240,240,.08) 88%, transparent 100%);
    }

    .label {
      position: absolute;
      left: 4.4%;
      top: 5.2%;
      z-index: 10;
      font-size: clamp(11px, 1.18vw, 18px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(240,240,240,.86);
    }
    .label .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,228,184,.9);
      box-shadow: 0 0 8px rgba(255,228,184,.6);
      margin-right: 9px;
      vertical-align: middle;
    }

    .sublabel {
      position: absolute;
      left: 4.4%;
      bottom: 5.4%;
      z-index: 10;
      font-size: clamp(9px, 0.92vw, 13px);
      font-style: italic;
      letter-spacing: 0.04em;
      color: rgba(240,240,240,.5);
    }

    .meta {
      position: absolute;
      right: 4.4%;
      bottom: 5.4%;
      z-index: 10;
      font-size: clamp(8px, 0.78vw, 11px);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(240,240,240,.34);
      text-align: right;
      line-height: 1.6;
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 11;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,.55) 100%);
    }

    .grain {
      position: absolute;
      inset: 0;
      z-index: 12;
      pointer-events: none;
      opacity: 0.05;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 160px 160px;
    }

    @media (max-aspect-ratio: 1/1) {
      .mechanism { width: min(82vmin, 460px); }
      .label { font-size: 11px; letter-spacing: 0.16em; }
      .sublabel { font-size: 10px; }
      .meta { font-size: 9px; }
    }
  </style>
</head>
<body>
  <div data-composition-id="interstellar-automata-preview" data-width="1512" data-height="982" data-duration="14" data-start="0" data-track-index="0">
    <div class="starfield" id="starfield"></div>

    <div class="crosshair"></div>
    <div class="crosshair h"></div>

    <div class="stage">
      <div class="mechanism">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
        <div class="ring r4"></div>

        <div class="ticks ticks-outer" id="ticks-outer"></div>
        <div class="ticks ticks-mid" id="ticks-mid"></div>

        <div class="orbit-arm" id="orbit-arm">
          <div class="orbit-dot"></div>
        </div>

        <div class="core"></div>
      </div>
    </div>

    <div class="label"><span class="dot"></span>Interstellar Automata</div>
    <div class="sublabel">product design</div>
    <div class="meta">04 / OBSERVATORY<br>SEQ 014</div>

    <div class="vignette"></div>
    <div class="grain"></div>

    <script>
      function mulberry32(seed) {
        return function() {
          let t = seed += 0x6D2B79F5;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      (function buildStars() {
        const rand = mulberry32(20260505);
        const sf = document.getElementById('starfield');
        const total = 88;
        for (let i = 0; i < total; i++) {
          const s = document.createElement('span');
          const r = rand();
          if (r < 0.12) s.className = 'star warm';
          else if (r < 0.55) s.className = 'star';
          else s.className = 'star dim';
          if (rand() < 0.55) s.classList.add('tiny');
          s.style.left = (rand() * 100).toFixed(2) + '%';
          s.style.top = (rand() * 100).toFixed(2) + '%';
          s.style.opacity = (0.35 + rand() * 0.6).toFixed(2);
          s.dataset.phase = rand().toFixed(3);
          sf.appendChild(s);
        }
      })();

      (function buildTicks() {
        const outer = document.getElementById('ticks-outer');
        for (let i = 0; i < 60; i++) {
          const t = document.createElement('span');
          t.className = 'tick' + (i % 5 === 0 ? ' long' : '');
          t.style.transform = `translateX(-50%) rotate(${i * 6}deg)`;
          outer.appendChild(t);
        }
        const mid = document.getElementById('ticks-mid');
        for (let i = 0; i < 24; i++) {
          const t = document.createElement('span');
          t.className = 'tick';
          t.style.transform = `translateX(-50%) rotate(${i * 15}deg)`;
          mid.appendChild(t);
        }
      })();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from('.mechanism', { scale: 0.78, opacity: 0, duration: 1.0, ease: 'power3.out' }, 0)
        .from('.ring.r1', { opacity: 0, duration: 0.8, ease: 'sine.out' }, 0.15)
        .from('.ring.r2', { opacity: 0, duration: 0.8, ease: 'sine.out' }, 0.28)
        .from('.ring.r3', { opacity: 0, duration: 0.8, ease: 'sine.out' }, 0.4)
        .from('.ring.r4', { opacity: 0, duration: 0.8, ease: 'sine.out' }, 0.52)
        .from('.ticks-outer .tick', { opacity: 0, duration: 0.5, stagger: { each: 0.008, from: 'start' }, ease: 'power2.out' }, 0.55)
        .from('.ticks-mid .tick', { opacity: 0, duration: 0.5, stagger: { each: 0.012, from: 'start' }, ease: 'power2.out' }, 0.7)
        .from('.core', { scale: 0, opacity: 0, duration: 0.9, ease: 'back.out(1.6)' }, 0.85)
        .from('.orbit-dot', { opacity: 0, scale: 0, duration: 0.55, ease: 'back.out(1.8)' }, 1.25)
        .from('.crosshair', { opacity: 0, duration: 0.9, stagger: 0.08, ease: 'sine.out' }, 0.6)
        .from('.label', { opacity: 0, x: -16, duration: 0.7, ease: 'power2.out' }, 1.1)
        .from('.label .dot', { scale: 0, opacity: 0, duration: 0.4, ease: 'back.out(2)' }, 1.35)
        .from('.sublabel', { opacity: 0, x: -10, duration: 0.7, ease: 'power2.out' }, 1.32)
        .from('.meta', { opacity: 0, x: 12, duration: 0.7, ease: 'power2.out' }, 1.4);

      tl.to('.ticks-outer', { rotation: 360, duration: 13.2, ease: 'none', transformOrigin: '50% 50%' }, 0)
        .to('.ticks-mid', { rotation: -360, duration: 13.2, ease: 'none', transformOrigin: '50% 50%' }, 0)
        .to('.ring.r3', { rotation: 360, duration: 13.2, ease: 'none', transformOrigin: '50% 50%' }, 0)
        .to('.ring.r4', { rotation: -360, duration: 13.2, ease: 'none', transformOrigin: '50% 50%' }, 0)
        .to('.orbit-arm', { rotation: 360, duration: 6.6, ease: 'none', repeat: 1, transformOrigin: '50% 50%' }, 0);

      tl.to('.core', { scale: 1.06, duration: 3.3, repeat: 3, yoyo: true, ease: 'sine.inOut' }, 1.0)
        .to('.label .dot', { opacity: 0.55, duration: 0.9, repeat: 12, yoyo: true, ease: 'sine.inOut' }, 1.5)
        .to('.starfield .star', {
          opacity: 0.28,
          duration: 1.4,
          stagger: { each: 0.04, from: 'random', repeat: 3, yoyo: true },
          ease: 'sine.inOut'
        }, 1.6);

      window.__timelines['interstellar-automata-preview'] = tl;

      if (!window.__hyperframes) {
        tl.eventCallback('onComplete', () => tl.restart());
        tl.play(0);
      }
    </script>
  </div>
</body>
</html>
