<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Cover Re-Design HyperFrame Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #08070a; }

    [data-composition-id="book-cover-redesign-preview"] {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 38%, #1a1620 0%, #0a080d 60%, #050307 100%);
      isolation: isolate;
    }

    /* Soft pink halo behind the cover for atmosphere */
    .halo {
      position: absolute;
      left: 50%; top: 50%;
      width: 90vmin; height: 90vmin;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255,26,163,0.14) 0%, rgba(255,26,163,0) 60%);
      z-index: 0;
      pointer-events: none;
      filter: blur(2px);
    }

    .cover {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: auto;
      height: 86%;
      max-width: 92%;
      object-fit: contain;
      box-shadow:
        0 40px 80px rgba(0,0,0,0.78),
        0 0 0 1px rgba(255,26,163,0.18);
      animation: rise 6s ease-in-out infinite;
      will-change: transform;
      z-index: 2;
      background: #14110d;
    }

    @keyframes rise {
      0%, 100% { transform: translate(-50%, -50%) translateY(0) scale(1); }
      50%      { transform: translate(-50%, -50%) translateY(-6px) scale(1.005); }
    }

    /* Subtle film grain over the whole composition */
    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.07;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      z-index: 5;
    }

    @media (prefers-reduced-motion: reduce) {
      .cover { animation: none; }
    }
  </style>
</head>
<body>
  <div data-composition-id="book-cover-redesign-preview">
    <div class="halo"></div>
    <img class="cover"
         src="../uploads/book-cover-moshfegh.jpg?v=20260506"
         alt="Book Cover Re-Design — My Year of Rest and Relaxation"
         decoding="async"
         loading="eager"
         fetchpriority="high">
    <div class="grain"></div>
  </div>
</body>
</html>
