<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Cover Re-Design HyperFrame Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050505; }

    [data-composition-id="book-cover-redesign-preview"] {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      color: #ff00b8;
      font-family: 'Archivo Black', 'Helvetica Neue', Arial, sans-serif;
      background:
        radial-gradient(ellipse at 50% 38%, #14161b 0%, #08090d 56%, #050505 100%);
      isolation: isolate;
    }

    .cover {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(70vh, 80vw, 460px);
      aspect-ratio: 0.66;
      background:
        linear-gradient(180deg, #14161b 0%, #08090d 56%, #050505 100%);
      box-shadow:
        0 36px 78px rgba(0,0,0,0.7),
        0 0 0 1px rgba(255,0,184,0.18),
        inset 0 0 0 6px rgba(255,0,184,0.05);
      overflow: hidden;
      will-change: transform, opacity;
    }

    .cover::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255,0,184,0.06) 0%, transparent 24%, transparent 76%, rgba(0,0,0,0.55) 100%);
      pointer-events: none;
      z-index: 4;
    }

    .figure {
      position: absolute;
      left: 50%;
      top: 56%;
      width: 132%;
      transform: translate(-50%, -50%);
      z-index: 2;
      opacity: 0.92;
      mix-blend-mode: screen;
      filter: contrast(1.18) brightness(1.06);
      will-change: transform, opacity;
    }

    .figure-shadow {
      position: absolute;
      left: 0;
      right: 0;
      top: 56%;
      height: 36%;
      transform: translateY(-50%);
      z-index: 1;
      background: radial-gradient(ellipse at center, rgba(255,0,184,0.12) 0%, transparent 64%);
      pointer-events: none;
    }

    .cover-title {
      position: absolute;
      left: 7%;
      right: 7%;
      top: 6%;
      display: flex;
      flex-direction: column;
      gap: clamp(2px, 0.4vw, 6px);
      z-index: 6;
      color: #ff00b8;
      font-family: 'Archivo Black', 'Helvetica Neue', Arial, sans-serif;
      line-height: 0.86;
      letter-spacing: -0.04em;
      text-transform: uppercase;
    }
    .cover-title .ln {
      font-size: clamp(34px, 6.4vw, 90px);
      overflow: hidden;
    }
    .cover-title .ln span {
      display: block;
      will-change: transform, opacity;
    }

    .cover-foot {
      position: absolute;
      left: 7%;
      right: 7%;
      bottom: 6.5%;
      z-index: 6;
      color: #ff00b8;
      font-family: 'Archivo Black', 'Helvetica Neue', Arial, sans-serif;
      font-size: clamp(11px, 1.4vw, 18px);
      letter-spacing: 0.18em;
      line-height: 1;
      text-transform: uppercase;
      text-align: left;
      will-change: opacity, transform;
    }
    .cover-foot .mark {
      display: inline-flex;
      align-items: center;
      gap: 0.6em;
    }
    .cover-foot .dot {
      display: inline-block;
      width: 0.55em;
      height: 0.55em;
      border-radius: 50%;
      background: #ff00b8;
    }

    .side-tag {
      position: absolute;
      right: 7%;
      top: 56%;
      transform: translateY(-50%) rotate(90deg);
      transform-origin: right center;
      z-index: 6;
      color: rgba(255,0,184,0.78);
      font-family: 'Libre Baskerville', Georgia, serif;
      font-style: italic;
      font-size: clamp(8px, 0.95vw, 12px);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      white-space: nowrap;
      will-change: opacity, transform;
    }

    .pink-rule {
      position: absolute;
      left: 7%;
      right: 7%;
      bottom: 14%;
      height: 2px;
      background: #ff00b8;
      transform-origin: left center;
      z-index: 6;
      will-change: transform, opacity;
    }

    .grain {
      position: absolute;
      inset: 0;
      z-index: 12;
      pointer-events: none;
      opacity: 0.16;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 160px 160px;
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 11;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 56%, rgba(0,0,0,0.6) 100%);
    }

    @media (max-aspect-ratio: 1/1) {
      .cover { width: min(82vw, 380px); }
      .cover-title .ln { font-size: clamp(34px, 8.8vw, 76px); }
      .side-tag { display: none; }
    }
  </style>
</head>
<body>
  <div data-composition-id="book-cover-redesign-preview" data-width="982" data-height="1280" data-duration="11" data-start="0" data-track-index="0">
    <div class="cover">
      <div class="figure-shadow"></div>
      <img class="figure" src="../uploads/folded-arm-fix.png" alt="" />

      <h1 class="cover-title">
        <div class="ln"><span>Book</span></div>
        <div class="ln"><span>Cover</span></div>
        <div class="ln"><span>Redesign</span></div>
      </h1>

      <span class="side-tag">an anonymous study</span>

      <span class="pink-rule"></span>

      <div class="cover-foot">
        <span class="mark"><span class="dot"></span>Coming Soon</span>
      </div>
    </div>

    <div class="vignette"></div>
    <div class="grain"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from('.cover', {
        y: 28,
        scale: 0.94,
        opacity: 0,
        duration: 0.95,
        ease: 'power3.out'
      }, 0.15);

      tl.from('.figure', {
        opacity: 0,
        scale: 1.06,
        duration: 1.1,
        ease: 'power2.out'
      }, 0.45);

      tl.from('.cover-title .ln span', {
        y: '110%',
        duration: 0.7,
        ease: 'expo.out',
        stagger: 0.16
      }, 0.85);

      tl.from('.pink-rule', {
        scaleX: 0,
        opacity: 0,
        duration: 0.6,
        ease: 'power3.out',
        transformOrigin: 'left center'
      }, 1.65);

      tl.from('.cover-foot', {
        opacity: 0,
        y: 12,
        duration: 0.55,
        ease: 'power2.out'
      }, 1.85);

      tl.from('.cover-foot .dot', {
        scale: 0,
        opacity: 0,
        duration: 0.4,
        ease: 'back.out(2)'
      }, 2.05);

      tl.from('.side-tag', {
        opacity: 0,
        y: -12,
        duration: 0.55,
        ease: 'power2.out'
      }, 2.0);

      tl.to('.cover-foot .dot', {
        opacity: 0.35,
        duration: 0.9,
        repeat: 6,
        yoyo: true,
        ease: 'sine.inOut'
      }, 2.4);

      tl.to('.figure', {
        x: 8,
        y: -4,
        scale: 1.012,
        duration: 3.4,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: 1
      }, 2.6);

      tl.to('.cover', {
        rotation: -0.4,
        y: -3,
        duration: 3.6,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: 1,
        transformOrigin: '50% 70%'
      }, 2.5);

      window.__timelines['book-cover-redesign-preview'] = tl;

      if (!window.__hyperframes) {
        tl.eventCallback('onComplete', () => tl.restart());
        tl.play(0);
      }
    </script>
  </div>
</body>
</html>
