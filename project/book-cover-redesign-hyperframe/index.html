<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Cover Re-Design HyperFrame Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050505; }

    [data-composition-id="book-cover-redesign-preview"] {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      color: #ff00b8;
      font-family: 'Archivo Black', 'Helvetica Neue', Arial, sans-serif;
      background:
        radial-gradient(circle at 78% 22%, rgba(255,0,184,.12), transparent 20%),
        linear-gradient(135deg, #050505 0%, #181713 45%, #5d5b4a 100%);
      isolation: isolate;
    }

    .light-table {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: clamp(18px, 3vw, 42px);
      z-index: 2;
    }

    .cover {
      position: relative;
      width: min(72vh, 78vw, 440px);
      aspect-ratio: 662 / 1000;
      overflow: hidden;
      background: #5d5b4a;
      box-shadow:
        0 28px 58px rgba(0,0,0,.48),
        0 0 0 1px rgba(242,238,230,.18),
        inset 0 0 0 7px rgba(5,5,5,.18);
      transform-origin: 50% 58%;
      will-change: transform, opacity;
    }

    .cover::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(180deg, rgba(5,5,5,.05), transparent 42%, rgba(5,5,5,.34)),
        radial-gradient(circle at 42% 38%, rgba(242,238,230,.18), transparent 34%);
      pointer-events: none;
    }

    .source-cover {
      position: absolute;
      left: 5.2%;
      top: 7%;
      width: min(20vw, 176px);
      aspect-ratio: 662 / 1000;
      object-fit: cover;
      z-index: 1;
      opacity: .28;
      filter: grayscale(1) contrast(.88) saturate(.2);
      transform: rotate(-7deg);
      box-shadow: 0 18px 34px rgba(0,0,0,.38);
      will-change: transform, opacity;
    }

    .reference-strip {
      position: absolute;
      right: 4.6%;
      bottom: 9%;
      width: min(31vw, 370px);
      height: clamp(80px, 15vw, 160px);
      object-fit: cover;
      z-index: 1;
      opacity: .38;
      filter: grayscale(1) contrast(1.18) brightness(.78);
      mix-blend-mode: screen;
      transform: rotate(3deg);
      will-change: transform, opacity;
    }

    .figure {
      position: absolute;
      left: -17%;
      top: 32%;
      width: 134%;
      z-index: 3;
      filter: grayscale(1) contrast(1.3) brightness(1.06);
      mix-blend-mode: screen;
      opacity: .94;
      transform-origin: 50% 55%;
      will-change: transform, opacity;
    }

    .figure-shadow {
      position: absolute;
      left: -9%;
      top: 49%;
      width: 118%;
      height: 18%;
      z-index: 2;
      background: radial-gradient(ellipse at center, rgba(5,5,5,.62), transparent 68%);
      transform: rotate(-3deg);
    }

    .title,
    .author {
      position: absolute;
      left: 6%;
      right: 6%;
      z-index: 5;
      display: grid;
      gap: .02em;
      color: #ff00b8;
      text-transform: uppercase;
      letter-spacing: -.025em;
      line-height: .9;
      text-shadow: 0 1px 0 rgba(5,5,5,.34);
    }

    .title {
      top: 4.4%;
      font-size: clamp(25px, 3.85vw, 54px);
    }

    .author {
      bottom: 4.2%;
      font-size: clamp(37px, 5.8vw, 78px);
    }

    .title span,
    .author span {
      display: block;
      will-change: transform, opacity;
    }

    .side-note {
      position: absolute;
      right: 7%;
      top: 55%;
      z-index: 6;
      width: 27%;
      color: #ff00b8;
      font-family: 'Libre Baskerville', Georgia, serif;
      font-size: clamp(10px, 1.05vw, 14px);
      line-height: 1.25;
      text-align: right;
      will-change: transform, opacity;
    }

    .plate-code {
      position: absolute;
      left: 7%;
      bottom: 24%;
      z-index: 6;
      color: rgba(242,238,230,.7);
      font-family: 'Libre Baskerville', Georgia, serif;
      font-size: clamp(8px, .78vw, 11px);
      letter-spacing: .14em;
      text-transform: uppercase;
      will-change: transform, opacity;
    }

    .crop-mark {
      position: absolute;
      width: clamp(16px, 2vw, 28px);
      height: clamp(16px, 2vw, 28px);
      z-index: 7;
      border-color: rgba(255,0,184,.78);
      will-change: transform, opacity;
    }
    .crop-mark.tl { left: 4%; top: 3%; border-left: 2px solid; border-top: 2px solid; }
    .crop-mark.tr { right: 4%; top: 3%; border-right: 2px solid; border-top: 2px solid; }
    .crop-mark.bl { left: 4%; bottom: 3%; border-left: 2px solid; border-bottom: 2px solid; }
    .crop-mark.br { right: 4%; bottom: 3%; border-right: 2px solid; border-bottom: 2px solid; }

    .caption {
      position: absolute;
      left: clamp(18px, 3vw, 42px);
      bottom: clamp(16px, 2.8vw, 36px);
      z-index: 8;
      color: rgba(242,238,230,.7);
      font-family: 'Libre Baskerville', Georgia, serif;
      font-size: clamp(9px, .88vw, 12px);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .pink-wash,
    .grain,
    .halftone,
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .pink-wash {
      z-index: 4;
      opacity: .16;
      mix-blend-mode: screen;
      background:
        linear-gradient(90deg, transparent 0 24%, rgba(255,0,184,.45) 24% 26%, transparent 26% 100%),
        linear-gradient(180deg, transparent 0 71%, rgba(255,0,184,.42) 71% 73%, transparent 73% 100%);
    }

    .grain {
      z-index: 12;
      opacity: .14;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
      background-size: 170px 170px;
    }

    .halftone {
      z-index: 11;
      opacity: .16;
      mix-blend-mode: multiply;
      background-image: radial-gradient(circle at center, rgba(5,5,5,.5) 0 1px, transparent 1.4px);
      background-size: 12px 12px;
    }

    .vignette {
      z-index: 13;
      box-shadow: inset 0 0 85px rgba(0,0,0,.44);
      background: radial-gradient(ellipse at center, transparent 58%, rgba(5,5,5,.44) 100%);
    }

    @media (max-aspect-ratio: 1/1) {
      .cover { width: min(78vw, 430px); }
      .source-cover { width: 24vw; opacity: .2; }
      .reference-strip { width: 42vw; }
      .title { font-size: clamp(25px, 7.4vw, 48px); }
      .author { font-size: clamp(38px, 11vw, 72px); }
      .caption { display: none; }
    }
  </style>
</head>
<body>
  <div data-composition-id="book-cover-redesign-preview" data-width="1280" data-height="982" data-duration="11" data-start="0" data-track-index="0">
    <img class="source-cover" src="../uploads/book-cover-rest-reference.jpg" alt="" />
    <img class="reference-strip" src="../uploads/sleeping-hermaphrodite-reference.jpg" alt="" />

    <main class="light-table">
      <section class="cover" aria-label="Animated book cover redesign preview">
        <div class="figure-shadow"></div>
        <img class="figure" src="../uploads/folded-arm-fix.png" alt="" />
        <div class="pink-wash"></div>

        <h1 class="title">
          <span>My Year of Rest</span>
          <span>and Relaxation</span>
        </h1>

        <p class="side-note">a novel<br>by the author<br>of <em>Eileen</em></p>
        <p class="plate-code">plate study / folded arm</p>

        <h2 class="author">
          <span>Ottessa</span>
          <span>Moshfegh</span>
        </h2>

        <i class="crop-mark tl"></i>
        <i class="crop-mark tr"></i>
        <i class="crop-mark bl"></i>
        <i class="crop-mark br"></i>
      </section>
    </main>

    <div class="caption">Book cover re-design / digital / graphic / type</div>
    <div class="halftone"></div>
    <div class="grain"></div>
    <div class="vignette"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from('.source-cover', {
        opacity: 0,
        x: -34,
        rotation: -11,
        duration: 0.72,
        ease: 'power3.out'
      }, 0.05);

      tl.from('.reference-strip', {
        opacity: 0,
        x: 42,
        rotation: 6,
        duration: 0.72,
        ease: 'power3.out'
      }, 0.12);

      tl.from('.cover', {
        opacity: 0,
        y: 24,
        scale: 0.965,
        duration: 0.84,
        ease: 'power3.out'
      }, 0.24);

      tl.from('.figure', {
        opacity: 0,
        x: -64,
        scale: 1.04,
        duration: 0.95,
        ease: 'power3.out'
      }, 0.62);

      tl.from('.title span', {
        opacity: 0,
        y: -28,
        duration: 0.62,
        ease: 'power3.out',
        stagger: 0.08
      }, 0.96);

      tl.from('.author span', {
        opacity: 0,
        y: 32,
        duration: 0.68,
        ease: 'power3.out',
        stagger: 0.08
      }, 1.15);

      tl.from('.side-note, .plate-code, .caption', {
        opacity: 0,
        y: 10,
        duration: 0.48,
        ease: 'power2.out',
        stagger: 0.08
      }, 1.55);

      tl.from('.crop-mark', {
        opacity: 0,
        scale: 0.65,
        duration: 0.38,
        ease: 'power2.out',
        stagger: 0.05
      }, 1.72);

      tl.to('.figure', {
        x: 18,
        y: -5,
        scale: 1.01,
        duration: 2.6,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: 2
      }, 2.15);

      tl.to('.cover', {
        rotation: -0.7,
        y: -5,
        duration: 2.8,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: 2
      }, 2.05);

      tl.to('.title span, .author span', {
        y: -3,
        duration: 2.1,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: 2,
        stagger: 0.03
      }, 2.35);

      tl.to('.pink-wash', {
        opacity: .28,
        duration: 1.45,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: 3
      }, 2.4);

      window.__timelines['book-cover-redesign-preview'] = tl;

      if (!window.__hyperframes) {
        tl.eventCallback('onComplete', () => tl.restart());
        tl.play(0);
      }
    </script>
  </div>
</body>
</html>
