<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Type Design Poster HyperFrame Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }

    [data-composition-id="type-poster-preview"] {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 45%, #0a0a0a 0%, #050505 60%, #000 100%);
      isolation: isolate;
    }

    /* Soft warm halo behind the poster */
    .halo {
      position: absolute;
      left: 50%; top: 50%;
      width: 95vmin; height: 95vmin;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(214, 168, 96, 0.16) 0%, rgba(214, 168, 96, 0) 60%);
      z-index: 0;
      pointer-events: none;
      filter: blur(2px);
    }

    .page-stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: clamp(12px, 2.4vh, 22px);
      animation: rise 6s ease-in-out infinite;
      will-change: transform;
      z-index: 2;
    }

    .page {
      display: block;
      width: auto;
      height: min(96vh, 84vw);
      max-height: calc(100vh - 24px);
      max-width: calc(100vw - 24px);
      object-fit: contain;
      background: #d9cdb0;
      box-shadow:
        0 40px 80px rgba(0,0,0,0.78),
        0 0 0 1px rgba(255, 230, 180, 0.08);
    }

    @keyframes rise {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-6px) scale(1.005); }
    }

    /* Subtle film grain over the whole composition */
    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.07;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      z-index: 5;
    }

    @media (prefers-reduced-motion: reduce) {
      .page-stage { animation: none; }
    }
  </style>
</head>
<body>
  <div data-composition-id="type-poster-preview" data-width="1280" data-height="982" data-duration="6" data-start="0" data-track-index="0">
    <div class="halo"></div>
    <div class="page-stage">
      <img class="page"
           src="../uploads/Type%20Design%20Risograph%20Poster.png?v=20260524"
           alt="Type Design Poster — Arcane"
           decoding="async"
           loading="eager"
           fetchpriority="high">
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
