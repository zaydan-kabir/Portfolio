<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Type Design Poster HyperFrame Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #323639; }

    [data-composition-id="type-poster-preview"] {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 42%, #3a3e42 0%, #2a2d30 60%, #1d1f21 100%);
      isolation: isolate;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    /* PDF viewer top toolbar */
    .pdf-toolbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: clamp(22px, 4.2vh, 34px);
      background: linear-gradient(to bottom, #45494d, #3a3d41);
      border-bottom: 1px solid #1d1f21;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(8px, 1.6vw, 16px);
      color: #d6d8da;
      font-size: clamp(8px, 0.85vw, 11px);
      letter-spacing: 0.02em;
      z-index: 10;
      user-select: none;
    }
    .pdf-toolbar .title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 60%;
    }
    .pdf-toolbar .pages {
      font-variant-numeric: tabular-nums;
      color: #b9bbbd;
    }
    .pdf-toolbar .dots {
      display: inline-flex;
      gap: 5px;
      margin-right: 10px;
    }
    .pdf-toolbar .dots span {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #6a6e72;
      display: inline-block;
    }
    .pdf-toolbar .dots span:nth-child(1) { background: #ec6a5e; }
    .pdf-toolbar .dots span:nth-child(2) { background: #f4be4f; }
    .pdf-toolbar .dots span:nth-child(3) { background: #61c554; }
    .pdf-toolbar .left { display: flex; align-items: center; min-width: 0; }

    /* Soft halo behind the page */
    .halo {
      position: absolute;
      left: 50%; top: 52%;
      width: 70vmin; height: 70vmin;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(140, 110, 70, 0.18) 0%, rgba(140, 110, 70, 0) 65%);
      z-index: 1;
      pointer-events: none;
      filter: blur(3px);
    }

    .page-stage {
      position: absolute;
      inset: 0;
      padding-top: clamp(30px, 5.5vh, 44px);
      display: grid;
      place-items: center;
      animation: rise 6s ease-in-out infinite;
      will-change: transform;
      z-index: 2;
    }

    .page {
      display: block;
      width: auto;
      height: min(72vh, 60vw);
      max-height: calc(100vh - 70px);
      max-width: calc(100vw - 60px);
      object-fit: contain;
      background: #d9cdb0;
      box-shadow:
        0 30px 60px rgba(0,0,0,0.55),
        0 6px 14px rgba(0,0,0,0.35),
        0 0 0 1px rgba(0,0,0,0.35);
    }

    @keyframes rise {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-6px) scale(1.005); }
    }

    /* Subtle film grain over the whole composition */
    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.06;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      z-index: 5;
    }

    /* PDF viewer bottom status bar */
    .pdf-status {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: clamp(16px, 3vh, 22px);
      background: linear-gradient(to top, #2a2d30, #34373a);
      border-top: 1px solid #1d1f21;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(8px, 1.6vw, 16px);
      color: #9a9c9e;
      font-size: clamp(7px, 0.7vw, 10px);
      letter-spacing: 0.04em;
      z-index: 10;
      user-select: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .page-stage { animation: none; }
    }
  </style>
</head>
<body>
  <div data-composition-id="type-poster-preview" data-width="1280" data-height="982" data-duration="6" data-start="0" data-track-index="0">
    <div class="pdf-toolbar">
      <div class="left">
        <span class="dots"><span></span><span></span><span></span></span>
        <span class="title">Type Design Risograph Poster.pdf</span>
      </div>
      <span class="pages">1 / 1</span>
    </div>

    <div class="halo"></div>

    <div class="page-stage">
      <img class="page"
           src="../uploads/Type%20Design%20Risograph%20Poster.png?v=20260524"
           alt="Type Design Risograph Poster — Arcane"
           decoding="async"
           loading="eager"
           fetchpriority="high">
    </div>

    <div class="grain"></div>

    <div class="pdf-status">
      <span>ZKA Studio — Specimen 05</span>
      <span>100%</span>
    </div>
  </div>
</body>
</html>
