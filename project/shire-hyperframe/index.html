<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shire HyperFrame Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800;900&family=Special+Elite&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #ece1c4; }

    [data-composition-id="shire-preview"] {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      color: #1a2c5b;
      font-family: 'Special Elite', 'Courier New', monospace;
      background:
        radial-gradient(circle at 82% 14%, rgba(200,148,50,.16), transparent 19%),
        radial-gradient(circle at 10% 88%, rgba(182,42,31,.10), transparent 26%),
        linear-gradient(135deg, #f3e8c9 0%, #ece1c4 45%, #decda6 100%);
      isolation: isolate;
    }

    .poster {
      position: absolute;
      inset: clamp(18px, 3vw, 42px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(210px, 28vw, 360px);
      align-items: end;
      gap: clamp(26px, 4.2vw, 70px);
      padding: clamp(34px, 5vw, 76px);
      border: 1px solid rgba(26,44,91,.26);
      background:
        linear-gradient(90deg, rgba(26,44,91,.055) 0 1px, transparent 1px 100%),
        linear-gradient(0deg, rgba(26,44,91,.05) 0 1px, transparent 1px 100%),
        rgba(236,225,196,.58);
      background-size: 34px 34px, 34px 34px, auto;
      box-shadow:
        inset 0 0 0 9px rgba(255,255,255,.18),
        0 22px 55px rgba(76,55,21,.16);
      z-index: 2;
    }

    .poster::before {
      content: '';
      position: absolute;
      inset: clamp(12px, 1.6vw, 20px);
      border: 1px solid rgba(26,44,91,.12);
      pointer-events: none;
    }

    .copy {
      position: relative;
      z-index: 4;
      align-self: center;
      padding-top: 2vw;
    }

    .eyebrow,
    .credit {
      margin: 0;
      color: rgba(26,44,91,.74);
      font-size: clamp(10px, 1.05vw, 14px);
      line-height: 1.45;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .wordmark {
      margin: clamp(11px, 2vw, 22px) 0 clamp(12px, 2vw, 24px);
      color: #1a2c5b;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(76px, 16.2vw, 205px);
      line-height: .78;
      letter-spacing: -.055em;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 2px 0 rgba(255,255,255,.28);
    }

    .wordmark span {
      display: inline-block;
      transform-origin: 50% 75%;
      will-change: transform, opacity;
    }

    .tagline {
      max-width: 46ch;
      margin: 0;
      color: rgba(26,44,91,.84);
      font-size: clamp(14px, 1.65vw, 23px);
      line-height: 1.45;
    }

    .rule {
      width: min(360px, 54vw);
      height: 2px;
      margin: clamp(18px, 3vw, 36px) 0 clamp(11px, 1.8vw, 18px);
      background: #b62a1f;
      transform-origin: left center;
    }

    .credit {
      color: rgba(182,42,31,.82);
      font-size: clamp(9px, .9vw, 12px);
    }

    .medal-wrap {
      position: relative;
      z-index: 3;
      width: min(100%, 330px);
      justify-self: center;
      align-self: center;
      display: grid;
      justify-items: center;
      will-change: transform, opacity;
    }

    .ribbon {
      position: relative;
      width: clamp(68px, 8.6vw, 108px);
      height: clamp(145px, 18vw, 230px);
      clip-path: polygon(0 0, 100% 0, 100% 82%, 50% 100%, 0 82%);
      background:
        linear-gradient(90deg,
          #1a2c5b 0 25%,
          #ece1c4 25% 37%,
          #b62a1f 37% 63%,
          #ece1c4 63% 75%,
          #1a2c5b 75% 100%);
      box-shadow: inset 0 0 0 1px rgba(26,44,91,.28), 0 15px 24px rgba(26,44,91,.18);
    }

    .ribbon::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 0 38%, rgba(255,255,255,.24) 45%, transparent 54% 100%);
      opacity: .55;
    }

    .medal {
      position: relative;
      width: clamp(138px, 17vw, 218px);
      aspect-ratio: 1;
      margin-top: clamp(-24px, -3vw, -34px);
      border-radius: 50%;
      background:
        radial-gradient(circle at 36% 30%, rgba(255,245,201,.9) 0 14%, transparent 15%),
        radial-gradient(circle at 50% 54%, #d8a747 0 35%, #c89432 36% 58%, #94631e 100%);
      border: clamp(7px, 1vw, 12px) solid #1a2c5b;
      box-shadow:
        inset 0 0 0 7px rgba(236,225,196,.62),
        inset 0 -22px 32px rgba(74,47,12,.24),
        0 22px 38px rgba(26,44,91,.22);
      display: grid;
      place-items: center;
      will-change: transform;
    }

    .medal::before {
      content: '';
      width: 52%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 2px solid rgba(26,44,91,.42);
      box-shadow: inset 0 0 0 10px rgba(255,244,203,.18);
    }

    .medal::after {
      content: 'S';
      position: absolute;
      color: rgba(26,44,91,.84);
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(58px, 7.5vw, 96px);
      font-weight: 900;
      line-height: 1;
      transform: translateY(-2%);
    }

    .service-line {
      position: absolute;
      right: clamp(28px, 5vw, 70px);
      bottom: clamp(22px, 4vw, 48px);
      z-index: 5;
      color: rgba(26,44,91,.55);
      font-size: clamp(9px, .95vw, 12px);
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .paper-noise,
    .halftone,
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .paper-noise {
      z-index: 10;
      opacity: .15;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.65'/%3E%3C/svg%3E");
      background-size: 190px 190px;
    }

    .halftone {
      z-index: 9;
      opacity: .18;
      mix-blend-mode: multiply;
      background-image:
        radial-gradient(circle at center, rgba(26,44,91,.34) 0 1px, transparent 1.3px),
        radial-gradient(circle at center, rgba(182,42,31,.20) 0 1px, transparent 1.4px);
      background-position: 0 0, 9px 9px;
      background-size: 18px 18px, 26px 26px;
    }

    .vignette {
      z-index: 11;
      box-shadow: inset 0 0 95px rgba(70,48,18,.18);
      background: radial-gradient(ellipse at center, transparent 58%, rgba(58,39,16,.18) 100%);
    }

    @media (max-aspect-ratio: 1/1) {
      .poster {
        grid-template-columns: 1fr;
        align-items: center;
        padding: 32px;
      }
      .medal-wrap {
        width: min(56vw, 260px);
        align-self: start;
      }
      .service-line {
        right: 32px;
        bottom: 28px;
      }
    }
  </style>
</head>
<body>
  <div data-composition-id="shire-preview" data-width="1280" data-height="640" data-duration="9" data-start="0" data-track-index="0">
    <main class="poster">
      <section class="copy">
        <p class="eyebrow">Currently building / veteran benefits access</p>
        <h1 class="wordmark" aria-label="Shire"><span>S</span><span>h</span><span>i</span><span>r</span><span>e</span></h1>
        <p class="tagline">A calmer way to understand benefits, preserve records, and move from uncertainty to the next step.</p>
        <div class="rule"></div>
        <p class="credit">UI/UX design / system design / design thinking</p>
      </section>

      <aside class="medal-wrap" aria-hidden="true">
        <div class="ribbon"></div>
        <div class="medal"></div>
      </aside>
    </main>

    <div class="service-line">service draft no. 04</div>
    <div class="halftone"></div>
    <div class="paper-noise"></div>
    <div class="vignette"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from('.poster', {
        opacity: 0,
        scale: 0.992,
        duration: 0.8,
        ease: 'power2.out'
      }, 0);

      tl.from('.eyebrow', {
        opacity: 0,
        y: 10,
        duration: 0.58,
        ease: 'power2.out'
      }, 0.32);

      tl.from('.wordmark span', {
        opacity: 0,
        y: 36,
        rotationX: -10,
        duration: 0.76,
        ease: 'power3.out',
        stagger: 0.055
      }, 0.55);

      tl.from('.tagline', {
        opacity: 0,
        y: 14,
        duration: 0.68,
        ease: 'power2.out'
      }, 1.06);

      tl.from('.rule', {
        scaleX: 0,
        duration: 0.7,
        ease: 'power2.inOut'
      }, 1.34);

      tl.from('.credit', {
        opacity: 0,
        y: 8,
        duration: 0.5,
        ease: 'power2.out'
      }, 1.62);

      tl.from('.medal-wrap', {
        opacity: 0,
        y: -34,
        scale: 0.94,
        duration: 1.05,
        ease: 'power3.out'
      }, 0.72);

      tl.from('.ribbon', {
        scaleY: 0,
        transformOrigin: '50% 0%',
        duration: 0.68,
        ease: 'power2.out'
      }, 0.92);

      tl.from('.medal', {
        scale: 0.82,
        rotation: -5,
        duration: 0.72,
        ease: 'back.out(1.25)'
      }, 1.22);

      tl.from('.service-line', {
        opacity: 0,
        y: 8,
        duration: 0.48,
        ease: 'power2.out'
      }, 1.9);

      tl.to('.medal', {
        y: -8,
        rotation: 1.4,
        duration: 2.15,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: 2
      }, 2.35);

      tl.to('.wordmark span', {
        y: -4,
        duration: 2.4,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: 1,
        stagger: 0.035
      }, 2.55);

      tl.to('.halftone', {
        opacity: .13,
        duration: 2.25,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: 2
      }, 2.2);

      window.__timelines['shire-preview'] = tl;

      if (!window.__hyperframes) {
        tl.eventCallback('onComplete', () => tl.restart());
        tl.play(0);
      }
    </script>
  </div>
</body>
</html>
