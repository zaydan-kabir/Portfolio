<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shire HyperFrame Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,900;1,400&family=Special+Elite&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #ece1c4; }

    [data-composition-id="shire-preview"] {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 38% 42%, #f3eacf 0%, #ece1c4 50%, #d8caa3 100%);
      color: #1a2c5b;
      font-family: 'Playfair Display', Georgia, serif;
      isolation: isolate;
    }

    .stage {
      position: absolute;
      inset: 8% 8.5%;
      display: grid;
      grid-template-columns: minmax(120px, 0.42fr) minmax(0, 1fr);
      align-items: center;
      gap: clamp(28px, 5vw, 86px);
      z-index: 4;
    }

    .medal-frame {
      position: relative;
      width: 100%;
      max-width: 240px;
      justify-self: end;
      filter: drop-shadow(0 6px 0 rgba(26,44,91,0.16)) drop-shadow(0 18px 22px rgba(26,44,91,0.18));
      will-change: transform;
    }
    .medal-frame svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .copy {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: clamp(6px, 0.8vw, 14px);
    }

    .eyebrow {
      font-family: 'Special Elite', 'Courier Prime', monospace;
      font-size: clamp(11px, 1.05vw, 16px);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #b62a1f;
      display: inline-flex;
      align-items: center;
      gap: 0.85em;
    }
    .eyebrow .rule {
      display: inline-block;
      width: clamp(28px, 4vw, 64px);
      height: 1px;
      background: #b62a1f;
    }

    .wordmark {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 900;
      font-size: clamp(72px, 14vw, 188px);
      line-height: 0.86;
      letter-spacing: -0.012em;
      color: #1a2c5b;
      margin: 0;
      will-change: transform;
    }
    .wordmark .l {
      display: inline-block;
      will-change: transform, opacity;
    }

    .tagline {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(15px, 1.7vw, 26px);
      letter-spacing: 0.01em;
      color: #1a2c5b;
      max-width: 28ch;
    }

    .credit {
      position: absolute;
      bottom: 6.4%;
      right: 8.5%;
      font-family: 'Special Elite', 'Courier Prime', monospace;
      font-size: clamp(10px, 0.95vw, 13px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(26,44,91,0.72);
      text-align: right;
      z-index: 6;
    }

    .stamp {
      position: absolute;
      top: 8%;
      right: 8.5%;
      transform: rotate(-6deg);
      font-family: 'Special Elite', 'Courier Prime', monospace;
      font-size: clamp(9px, 0.92vw, 12px);
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: #b62a1f;
      padding: 6px 12px 7px;
      border: 1.5px solid #b62a1f;
      background: rgba(236,225,196,0.4);
      z-index: 6;
      white-space: nowrap;
    }
    .stamp::before {
      content: '';
      position: absolute;
      inset: 2px;
      border: 1px solid rgba(182,42,31,0.5);
      pointer-events: none;
    }

    .halftone {
      position: absolute;
      inset: 0;
      z-index: 13;
      pointer-events: none;
      opacity: 0.18;
      mix-blend-mode: multiply;
      background-image: radial-gradient(circle at 1px 1px, rgba(26,44,91,0.42) 0.55px, transparent 1.4px);
      background-size: 4px 4px;
    }

    .grain {
      position: absolute;
      inset: 0;
      z-index: 12;
      pointer-events: none;
      opacity: 0.18;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 160px 160px;
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 11;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(60,38,12,0.34) 100%);
    }

    .paper-edge {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 14;
      box-shadow: inset 0 0 0 6px rgba(26,44,91,0.05), inset 0 0 80px rgba(60,38,12,0.18);
    }

    @media (max-aspect-ratio: 1/1) {
      .stage {
        grid-template-columns: 1fr;
        gap: 22px;
        align-content: center;
        justify-items: center;
        text-align: center;
      }
      .medal-frame { max-width: 180px; justify-self: center; }
      .copy { align-items: center; text-align: center; }
      .wordmark { font-size: clamp(56px, 18vw, 160px); }
      .tagline { font-size: clamp(13px, 3.6vw, 22px); }
    }
    @media (max-aspect-ratio: 2/1) and (min-aspect-ratio: 1/1) {
      .medal-frame { max-width: 200px; }
    }
  </style>
</head>
<body>
  <div data-composition-id="shire-preview" data-width="1280" data-height="640" data-duration="11" data-start="0" data-track-index="0">
    <div class="stage">
      <div class="medal-frame">
        <svg viewBox="0 0 160 280" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"  stop-color="#e3b65a" />
              <stop offset="48%" stop-color="#c89432" />
              <stop offset="100%" stop-color="#8a6520" />
            </linearGradient>
            <linearGradient id="brassRim" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"  stop-color="#a47820" />
              <stop offset="100%" stop-color="#5e4310" />
            </linearGradient>
            <linearGradient id="ribbonRed" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"  stop-color="#c8362b" />
              <stop offset="100%" stop-color="#8a1a12" />
            </linearGradient>
            <linearGradient id="ribbonNavy" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"  stop-color="#26417a" />
              <stop offset="100%" stop-color="#11203f" />
            </linearGradient>
          </defs>

          <!-- Pin bar -->
          <rect class="m-pin" x="40" y="6" width="80" height="6" rx="1.5" fill="url(#brassRim)" />

          <!-- Striped ribbon bar -->
          <g class="m-bar">
            <rect x="36" y="14" width="88" height="44" fill="#1a2c5b" />
            <rect x="36" y="14" width="29.33" height="44" fill="url(#ribbonNavy)" />
            <rect x="65.33" y="14" width="29.33" height="44" fill="#ece1c4" />
            <rect x="94.67" y="14" width="29.33" height="44" fill="url(#ribbonRed)" />
            <rect x="36" y="14" width="88" height="44" fill="none" stroke="#1a2c5b" stroke-width="1.4" />
            <line x1="36" y1="22" x2="124" y2="22" stroke="rgba(255,255,255,0.18)" stroke-width="1" />
          </g>

          <!-- Hanging cord (folded ribbon) -->
          <g class="m-cord">
            <path d="M 60 58 L 56 130 L 80 156 L 104 130 L 100 58 Z" fill="url(#ribbonRed)" />
            <path d="M 60 58 L 56 130 L 80 156 L 104 130 L 100 58 Z" fill="none" stroke="#5b110a" stroke-width="1.2" />
            <path d="M 80 58 L 80 156" stroke="rgba(255,255,255,0.14)" stroke-width="1" />
          </g>

          <!-- Star medal -->
          <g class="m-star" transform="translate(80 200)">
            <circle r="56" fill="url(#brass)" stroke="url(#brassRim)" stroke-width="2.2" />
            <circle r="46" fill="none" stroke="rgba(94,67,16,0.5)" stroke-width="1" />
            <polygon
              points="0,-36  9,-12  35,-12  14,4  22,32  0,16  -22,32  -14,4  -35,-12  -9,-12"
              fill="#ece1c4"
              stroke="rgba(94,67,16,0.55)"
              stroke-width="1.2"
              stroke-linejoin="round" />
            <circle r="6" fill="#1a2c5b" />
            <circle r="2.4" fill="#c89432" />
          </g>
        </svg>
      </div>

      <div class="copy">
        <span class="eyebrow"><span class="rule"></span>Currently Building</span>
        <h1 class="wordmark">
          <span class="l">S</span><span class="l">H</span><span class="l">I</span><span class="l">R</span><span class="l">E</span>
        </h1>
        <p class="tagline">A quiet shelter — for those who served.</p>
      </div>
    </div>

    <div class="stamp">Edition 01 · In Progress</div>

    <div class="credit">
      UI/UX &nbsp;·&nbsp; System &nbsp;·&nbsp; Design Thinking
    </div>

    <div class="halftone"></div>
    <div class="vignette"></div>
    <div class="grain"></div>
    <div class="paper-edge"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from('.medal-frame', {
        y: -28,
        opacity: 0,
        scale: 0.92,
        duration: 0.95,
        ease: 'power3.out'
      }, 0.2);

      tl.from('.m-pin', {
        scaleY: 0,
        opacity: 0,
        duration: 0.4,
        ease: 'power2.out',
        transformOrigin: '50% 0%'
      }, 0.4)
      .from('.m-bar', {
        scaleY: 0,
        opacity: 0,
        duration: 0.45,
        ease: 'power3.out',
        transformOrigin: '50% 0%'
      }, 0.5)
      .from('.m-cord', {
        scaleY: 0,
        opacity: 0,
        duration: 0.55,
        ease: 'power3.out',
        transformOrigin: '50% 0%'
      }, 0.7)
      .from('.m-star', {
        scale: 0,
        opacity: 0,
        rotation: -28,
        duration: 0.7,
        ease: 'back.out(1.8)',
        transformOrigin: '50% 50%'
      }, 0.95);

      tl.from('.eyebrow', {
        x: -14,
        opacity: 0,
        duration: 0.6,
        ease: 'power2.out'
      }, 1.05);

      tl.from('.wordmark .l', {
        y: 70,
        opacity: 0,
        duration: 0.7,
        ease: 'expo.out',
        stagger: 0.07
      }, 1.25);

      tl.from('.tagline', {
        y: 16,
        opacity: 0,
        duration: 0.65,
        ease: 'power2.out'
      }, 1.85);

      tl.from('.credit', {
        opacity: 0,
        y: 8,
        duration: 0.6,
        ease: 'power2.out'
      }, 2.05);

      tl.from('.stamp', {
        opacity: 0,
        scale: 0.5,
        rotation: 12,
        duration: 0.6,
        ease: 'back.out(2)'
      }, 2.2);

      tl.to('.stamp', { rotation: -8, duration: 0.18, ease: 'sine.inOut' }, 2.78)
        .to('.stamp', { rotation: -6, duration: 0.22, ease: 'sine.inOut' }, 2.96);

      tl.to('.medal-frame', {
        rotation: 1.6,
        duration: 4.2,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: 1,
        transformOrigin: '50% 6%'
      }, 2.6);

      window.__timelines['shire-preview'] = tl;

      if (!window.__hyperframes) {
        tl.eventCallback('onComplete', () => tl.restart());
        tl.play(0);
      }
    </script>
  </div>
</body>
</html>
