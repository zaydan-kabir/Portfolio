<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shire HyperFrame Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Bebas+Neue&family=Bowlby+One+SC&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }

    [data-composition-id="shire-preview"] {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      /* Warm aged-film grey */
      background:
        radial-gradient(ellipse at 50% 45%, #b9b4a6 0%, #948d7d 60%, #5a554a 100%);
      color: #1a1a1a;
      font-family: 'Special Elite', 'Courier New', monospace;
      isolation: isolate;
      filter: contrast(1.08) saturate(0.05);  /* desaturate to old film monochrome */
    }

    /* Letterbox bars */
    .bar-top, .bar-bot {
      position: absolute;
      left: 0; right: 0;
      height: 7%;
      background: #000;
      z-index: 25;
    }
    .bar-top { top: 0; }
    .bar-bot { bottom: 0; }

    /* Slim film perforations on the very edge */
    .perf {
      position: absolute;
      top: 7%;
      bottom: 7%;
      width: 14px;
      background:
        repeating-linear-gradient(
          to bottom,
          #000 0px, #000 6px,
          transparent 6px, transparent 16px
        );
      z-index: 24;
    }
    .perf.l { left: 0; }
    .perf.r { right: 0; }

    /* Inner frame */
    .stage {
      position: absolute;
      top: 7%; bottom: 7%;
      left: 14px; right: 14px;
      z-index: 5;
      overflow: hidden;
    }

    /* The drawn scene — cartoon Vault Boy + Shire title */
    .scene {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      align-items: center;
      padding: 4% 6%;
      gap: 4%;
    }

    /* Vault-Boy style figure */
    .vb {
      width: 100%;
      height: 92%;
      max-height: 92%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .vb svg {
      width: 100%;
      height: 100%;
    }

    /* Right column: title block */
    .title-block {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: clamp(8px, 1.2vh, 16px);
    }
    .pre {
      font-family: 'Bebas Neue', 'Special Elite', sans-serif;
      font-size: clamp(12px, 1.6vw, 22px);
      letter-spacing: 0.42em;
      color: #1a1a1a;
      opacity: 0.78;
    }
    .title {
      font-family: 'Bowlby One SC', 'Bebas Neue', Impact, sans-serif;
      font-size: clamp(80px, 14vw, 200px);
      letter-spacing: -0.01em;
      line-height: 0.86;
      color: #0c0c0c;
      text-shadow: 3px 3px 0 rgba(0,0,0,0.18);
      transform: skew(-2deg);
    }
    .sub {
      font-family: 'Special Elite', monospace;
      font-size: clamp(14px, 1.6vw, 22px);
      line-height: 1.4;
      color: #1a1a1a;
      max-width: 92%;
    }
    .stars {
      display: flex;
      gap: 10px;
      align-items: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(14px, 1.5vw, 20px);
      letter-spacing: 0.34em;
      color: #1a1a1a;
      margin-top: 6px;
    }
    .star {
      display: inline-block;
      width: 14px; height: 14px;
      background: #1a1a1a;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    }

    /* Heavy film grain */
    .grain {
      position: absolute;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      opacity: 0.42;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.4' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 240px 240px;
      animation: jitter 0.5s steps(4, end) infinite;
    }
    @keyframes jitter {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(-2px, 1px); }
      50%  { transform: translate(1px, -2px); }
      75%  { transform: translate(-1px, -1px); }
      100% { transform: translate(2px, 1px); }
    }

    /* Scratches — vertical line streaks */
    .scratches {
      position: absolute;
      inset: 0;
      z-index: 31;
      pointer-events: none;
      opacity: 0.35;
      mix-blend-mode: screen;
      background:
        linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.6) 18%, transparent 22%, transparent 60%, rgba(255,255,255,0.3) 71%, transparent 75%, transparent 88%, rgba(255,255,255,0.5) 94%, transparent 96%);
      background-size: 2px 100%;
      background-repeat: repeat-x;
      animation: scratch-shift 1.8s steps(6, end) infinite;
    }
    @keyframes scratch-shift {
      0% { background-position: 0 0; }
      100% { background-position: 100% 0; }
    }

    /* Vignette / lens fall-off */
    .vignette {
      position: absolute;
      inset: 0;
      z-index: 28;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.55) 100%);
    }

    /* Projector flicker */
    .flicker {
      position: absolute;
      inset: 0;
      z-index: 29;
      pointer-events: none;
      background: rgba(0,0,0,0);
      animation: flicker 4s infinite;
    }
    @keyframes flicker {
      0%, 100%       { background: rgba(0,0,0,0); }
      4%             { background: rgba(0,0,0,0.18); }
      5%             { background: rgba(0,0,0,0); }
      37%            { background: rgba(0,0,0,0.08); }
      38%            { background: rgba(0,0,0,0); }
      74%            { background: rgba(255,255,255,0.06); }
      75%            { background: rgba(0,0,0,0); }
    }

    /* Reel countdown — bottom-left */
    .reel {
      position: absolute;
      left: 5%;
      bottom: 10%;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(12px, 1.3vw, 18px);
      letter-spacing: 0.32em;
      color: #1a1a1a;
      z-index: 10;
    }

    @media (max-aspect-ratio: 1/1) {
      .scene { grid-template-columns: 1fr; grid-template-rows: 1fr auto; padding: 6% 8%; gap: 2%; }
      .vb { height: auto; max-height: 50%; }
      .title-block { align-items: center; text-align: center; }
      .title { transform: none; }
    }
  </style>
</head>
<body>
  <div data-composition-id="shire-preview" data-width="1280" data-height="982" data-duration="9" data-start="0" data-track-index="0">

    <div class="bar-top"></div>

            <!-- Right arm — raised, ending in a thumbs-up -->

            <path class="stroke" d="

            <!-- Hand / thumbs-up -->

              <!-- Thumb sticking up -->

                Q 46 -32 38 -16 Z"/>
              <path class="stroke" d="
                M 16 -8

                Q 46 -32 38 -16"/>

              <path class="stroke-thin" d="M 4 6 Q 24 14 44 4"/>
              <path class="stroke-thin" d="M 6 22 Q 24 30 42 22"/>
            </g>

            <!-- ============ HEAD ============ -->
            <!-- Head shape -->
            <path class="skin" d="
              M 230 60

              Q 350 270 270 290
              Q 260 295 230 295
              Q 200 295 190 290
              Q 110 270 110 175
              Q 110 60 230 60 Z"/>
            <path class="stroke" d="

            <!-- Hair — side-parted with a curl -->

              Q 250 35 290 60
              Q 325 60 332 105
              Q 310 90 280 92

            <path class="ink" d="

            <!-- Ears -->
            <path class="skin" d="M 106 165 Q 90 178 96 200 Q 104 215 118 210 Z"/>

            <path class="stroke-thin" d="M 104 180 Q 108 192 116 196"/>

            <path class="skin" d="M 354 165 Q 370 178 364 200 Q 356 215 342 210 Z"/>
            <path class="stroke" d="M 354 165 Q 370 178 364 200 Q 356 215 342 210"/>
            <path class="stroke-thin" d="M 356 180 Q 352 192 344 196"/>

            <path class="stroke" stroke-width="8" d="M 168 152 Q 195 142 220 154"/>
            <path class="stroke" stroke-width="8" d="M 248 154 Q 273 142 300 152"/>

            <circle cx="270" cy="175" r="3.5" fill="#f3ecda"/>

            <!-- Smile with teeth -->
            <path class="skin" d="M 178 252 Q 234 290 290 252 Q 280 268 234 274 Q 188 268 178 252 Z"/>

            <path class="stroke-thin" d="M 226 254 L 226 268"/>
            <path class="stroke-thin" d="M 244 254 L 244 268"/>

            <!-- Cheek line -->
            <path class="stroke-thin" d="M 300 222 Q 314 234 308 246"/>

            <!-- Chin shadow -->
            <path class="stroke-thin" d="M 210 280 Q 230 287 252 280"/>
          </svg>
        </div>

        <div class="title-block">
          <div class="pre">Coming soon to a screen near you</div>
          <div class="title">SHIRE</div>
          <div class="sub">
            <strong>Currently in development.</strong><br>
            A handy little system for the modern designer. UI/UX, system design, and a healthy dose of design thinking — all in one tidy package!

          <div class="stars">
            <span class="star"></span><span class="star"></span><span class="star"></span>

      </div>
    </div>

    <div class="reel">REEL 03 · 2:32 / 7:14</div>

    <div class="vignette"></div>
    <div class="flicker"></div>
    <div class="grain"></div>
    <div class="scratches"></div>
  </div>
</body>
</html>
