<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shire HyperFrame Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Bebas+Neue&family=Bowlby+One+SC&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }

    [data-composition-id="shire-preview"] {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 45%, #b9b4a6 0%, #948d7d 60%, #5a554a 100%);
      color: #1a1a1a;
      font-family: 'Special Elite', 'Courier New', monospace;
      isolation: isolate;
      filter: contrast(1.08) saturate(0.05);
    }

    /* Letterbox */
    .bar-top, .bar-bot {
      position: absolute; left: 0; right: 0;
      height: 7%; background: #000; z-index: 25;
    }
    .bar-top { top: 0; }
    .bar-bot { bottom: 0; }

    /* Film perforations */
    .perf {
      position: absolute;
      top: 7%; bottom: 7%;
      width: 14px;
      background: repeating-linear-gradient(
        to bottom, #000 0px, #000 6px, transparent 6px, transparent 16px);
      z-index: 24;
    }
    .perf.l { left: 0; }
    .perf.r { right: 0; }

    .stage {
      position: absolute;
      top: 7%; bottom: 7%; left: 14px; right: 14px;
      z-index: 5; overflow: hidden;
    }

    /* Comic-burst rays radiating from center-right (action burst) */
    .burst {
      position: absolute;
      left: 64%;
      top: 50%;
      width: 100vmin;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      z-index: 2;
      pointer-events: none;
      opacity: 0.42;
      background:
        repeating-conic-gradient(
          from 0deg,
          rgba(26,26,26,0.55) 0deg 5deg,
          transparent 5deg 18deg
        );
      mask-image: radial-gradient(circle, transparent 18%, #000 30%, #000 60%, transparent 75%);
      -webkit-mask-image: radial-gradient(circle, transparent 18%, #000 30%, #000 60%, transparent 75%);
      animation: spin 60s linear infinite;
    }
    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

    .scene {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr 1.05fr;
      align-items: center;
      padding: 4% 6%;
      gap: 3%;
    }

    .vb {
      width: 100%;
      height: 92%;
      max-height: 92%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 4;
      animation: bob 3.6s ease-in-out infinite;
    }
    .vb svg { width: 100%; height: 100%; }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-10px) rotate(-1deg); }
    }

    /* Title block */
    .title-block {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: clamp(8px, 1.4vh, 18px);
      position: relative;
      z-index: 4;
    }
    .marquee {
      display: inline-block;
      padding: 5px 14px 6px;
      border: 2.5px solid #0c0c0c;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(13px, 1.5vw, 20px);
      letter-spacing: 0.4em;
      color: #0c0c0c;
      background: rgba(255,255,255,0.05);
      position: relative;
    }
    .marquee::after {
      content: '';
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(12,12,12,0.45);
    }

    .title {
      font-family: 'Bowlby One SC', 'Bebas Neue', Impact, sans-serif;
      font-size: clamp(80px, 14vw, 200px);
      letter-spacing: -0.01em;
      line-height: 0.86;
      color: #0c0c0c;
      text-shadow:
        3px 3px 0 rgba(0,0,0,0.18),
        6px 6px 0 rgba(0,0,0,0.08);
      transform: skew(-2deg);
      animation: stamp 4.8s ease-out infinite;
      transform-origin: 30% 100%;
    }
    @keyframes stamp {
      0%       { transform: skew(-2deg) scale(1); }
      3%       { transform: skew(-2deg) scale(1.025) rotate(-0.6deg); }
      8%       { transform: skew(-2deg) scale(1) rotate(0deg); }
      100%     { transform: skew(-2deg) scale(1); }
    }

    .sub {
      font-family: 'Special Elite', monospace;
      font-size: clamp(14px, 1.6vw, 22px);
      line-height: 1.45;
      color: #1a1a1a;
      max-width: 95%;
    }
    .sub strong { font-weight: 400; border-bottom: 2px solid #0c0c0c; padding-bottom: 1px; }

    .meta-row {
      display: flex;
      gap: 22px;
      align-items: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(13px, 1.4vw, 18px);
      letter-spacing: 0.32em;
      color: #1a1a1a;
      margin-top: 6px;
    }
    .star {
      display: inline-block;
      width: 14px; height: 14px;
      background: #1a1a1a;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    }
    .meta-row .stars { display: inline-flex; gap: 6px; }
    .meta-row .dot { display: inline-block; width: 4px; height: 4px; background: #1a1a1a; border-radius: 50%; }

    /* Speech burst behind the thumbs-up — comic SFX */
    .pow {
      position: absolute;
      top: 12%;
      left: 32%;
      width: clamp(80px, 11vw, 160px);
      aspect-ratio: 1;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(-12deg);
      animation: pow-bounce 1.6s ease-in-out infinite;
    }
    @keyframes pow-bounce {
      0%, 100% { transform: rotate(-12deg) scale(1); }
      50%      { transform: rotate(-12deg) scale(1.08); }
    }
    .pow svg { width: 100%; height: 100%; }
    .pow .label {
      position: absolute;
      font-family: 'Bowlby One SC', Impact, sans-serif;
      font-size: clamp(16px, 2.2vw, 30px);
      letter-spacing: 0.05em;
      color: #0c0c0c;
      transform: rotate(8deg);
    }

    /* Bottom-left counter / corner mark */
    .reel {
      position: absolute;
      left: 5%; bottom: 10%;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(12px, 1.3vw, 18px);
      letter-spacing: 0.32em;
      color: #1a1a1a;
      z-index: 10;
    }
    .reel-right {
      position: absolute;
      right: 5%; bottom: 10%;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(12px, 1.3vw, 18px);
      letter-spacing: 0.32em;
      color: #1a1a1a;
      z-index: 10;
    }

    /* Heavy film grain */
    .grain {
      position: absolute;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      opacity: 0.42;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.4' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 240px 240px;
      animation: jitter 0.5s steps(4, end) infinite;
    }
    @keyframes jitter {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(-2px, 1px); }
      50%  { transform: translate(1px, -2px); }
      75%  { transform: translate(-1px, -1px); }
      100% { transform: translate(2px, 1px); }
    }

    .scratches {
      position: absolute;
      inset: 0;
      z-index: 31;
      pointer-events: none;
      opacity: 0.35;
      mix-blend-mode: screen;
      background:
        linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.6) 18%, transparent 22%, transparent 60%, rgba(255,255,255,0.3) 71%, transparent 75%, transparent 88%, rgba(255,255,255,0.5) 94%, transparent 96%);
      background-size: 2px 100%;
      background-repeat: repeat-x;
      animation: scratch-shift 1.8s steps(6, end) infinite;
    }
    @keyframes scratch-shift {
      0% { background-position: 0 0; }
      100% { background-position: 100% 0; }
    }

    .vignette {
      position: absolute;
      inset: 0; z-index: 28; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.55) 100%);
    }

    .flicker {
      position: absolute;
      inset: 0; z-index: 29; pointer-events: none;
      background: rgba(0,0,0,0);
      animation: flicker 4s infinite;
    }
    @keyframes flicker {
      0%, 100%       { background: rgba(0,0,0,0); }
      4%             { background: rgba(0,0,0,0.18); }
      5%             { background: rgba(0,0,0,0); }
      37%            { background: rgba(0,0,0,0.08); }
      38%            { background: rgba(0,0,0,0); }
      74%            { background: rgba(255,255,255,0.06); }
      75%            { background: rgba(0,0,0,0); }
    }

    @media (max-aspect-ratio: 1/1) {
      .scene { grid-template-columns: 1fr; grid-template-rows: 1fr auto; padding: 6% 8%; gap: 2%; }
      .vb { height: auto; max-height: 50%; }
      .title-block { align-items: center; text-align: center; }
      .title { transform: none; }
      .pow { display: none; }
    }
  </style>
</head>
