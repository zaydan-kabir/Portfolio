<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shire HyperFrame Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }

    [data-composition-id="shire-preview"] {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 55%, #0e2412 0%, #061309 70%, #000 100%);
      color: #6cf088;
      font-family: 'VT323', 'Share Tech Mono', 'Courier New', monospace;
      isolation: isolate;
    }

    /* Pip-Boy bezel */
    .bezel {
      position: absolute;
      inset: 4% 5%;
      border: 2px solid rgba(108, 240, 136, 0.55);
      box-shadow:
        inset 0 0 0 6px rgba(0, 0, 0, 0.5),
        inset 0 0 0 7px rgba(108, 240, 136, 0.18),
        0 0 24px rgba(108, 240, 136, 0.20);
      z-index: 3;
      pointer-events: none;
    }
    .bezel::before,
    .bezel::after {
      content: '';
      position: absolute;
      left: 12px; right: 12px;
      height: 2px;
      background: rgba(108, 240, 136, 0.35);
    }
    .bezel::before { top: 38px; }
    .bezel::after  { bottom: 38px; }

    .top-bar {
      position: absolute;
      top: 5.6%;
      left: 7%;
      right: 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'VT323', monospace;
      font-size: clamp(14px, 1.5vw, 22px);
      letter-spacing: 0.18em;
      color: #8df8a4;
      text-shadow: 0 0 8px rgba(108, 240, 136, 0.6);
      z-index: 6;
      text-transform: uppercase;
    }
    .top-bar .tab {
      display: inline-block;
      padding: 4px 14px;
      border: 1.5px solid #6cf088;
      background: rgba(108, 240, 136, 0.12);
    }
    .top-bar .meter {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85em;
    }
    .top-bar .meter .bars {
      display: inline-flex;
      gap: 3px;
    }
    .top-bar .meter .bars i {
      display: block;
      width: 6px; height: 14px;
      background: #6cf088;
      box-shadow: 0 0 4px #6cf088;
    }
    .top-bar .meter .bars i:nth-child(n+6) {
      opacity: 0.22;
      box-shadow: none;
      background: transparent;
      border: 1px solid rgba(108, 240, 136, 0.4);
    }

    /* Vault badge on the left */
    .vault-mark {
      position: absolute;
      left: 8.5%;
      top: 22%;
      width: 28%;
      max-width: 280px;
      aspect-ratio: 1;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid rgba(108, 240, 136, 0.5);
      box-shadow: 0 0 14px rgba(108, 240, 136, 0.18) inset;
      background: rgba(108, 240, 136, 0.04);
    }
    .vault-mark::before {
      content: '';
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(108, 240, 136, 0.28);
    }
    .vault-mark .num {
      font-family: 'VT323', monospace;
      font-size: clamp(56px, 9vw, 130px);
      line-height: 1;
      color: #c9ffd6;
      text-shadow: 0 0 14px rgba(108, 240, 136, 0.7);
    }
    .vault-mark .label {
      position: absolute;
      top: 8px; left: 8px;
      font-size: 11px;
      letter-spacing: 0.32em;
      color: rgba(108, 240, 136, 0.75);
    }
    .vault-mark .corner {
      position: absolute;
      bottom: 6px; right: 8px;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: rgba(108, 240, 136, 0.55);
    }

    /* Stats on the right */
    .stats {
      position: absolute;
      right: 8.5%;
      top: 21%;
      width: 46%;
      z-index: 5;
      font-family: 'VT323', monospace;
      color: #8df8a4;
      text-shadow: 0 0 6px rgba(108, 240, 136, 0.45);
    }
    .stats h1 {
      margin: 0 0 14px;
      font-size: clamp(34px, 4.6vw, 64px);
      letter-spacing: 0.06em;
      line-height: 1;
      text-transform: uppercase;
      color: #c9ffd6;
    }
    .stats .sub {
      font-size: clamp(13px, 1.3vw, 18px);
      letter-spacing: 0.22em;
      color: rgba(108, 240, 136, 0.75);
      text-transform: uppercase;
      margin-bottom: 22px;
    }
    .stats .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(14px, 1.4vw, 19px);
      letter-spacing: 0.12em;
      padding: 6px 0;
      border-bottom: 1px dotted rgba(108, 240, 136, 0.35);
      text-transform: uppercase;
    }
    .stats .row .k { color: rgba(108, 240, 136, 0.75); }
    .stats .row .v { color: #c9ffd6; }
    .stats .row .bar {
      display: inline-flex;
      gap: 2px;
      margin-left: 10px;
    }
    .stats .row .bar i {
      width: 9px; height: 10px;
      background: #6cf088;
      box-shadow: 0 0 3px #6cf088;
    }
    .stats .row .bar i.off { background: transparent; border: 1px solid rgba(108, 240, 136, 0.35); box-shadow: none; }

    /* PLEASE STAND BY */
    .stand-by {
      position: absolute;
      left: 50%;
      bottom: 11%;
      transform: translateX(-50%);
      font-size: clamp(14px, 1.5vw, 20px);
      letter-spacing: 0.4em;
      color: #6cf088;
      text-shadow: 0 0 10px rgba(108, 240, 136, 0.7);
      z-index: 6;
      animation: blink 1.6s steps(2, end) infinite;
      text-transform: uppercase;
      white-space: nowrap;
    }
    @keyframes blink {
      0%, 60% { opacity: 1; }
      61%, 100% { opacity: 0.25; }
    }

    .footer-bar {
      position: absolute;
      bottom: 5.6%;
      left: 7%;
      right: 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(12px, 1.2vw, 17px);
      letter-spacing: 0.18em;
      color: rgba(108, 240, 136, 0.75);
      text-transform: uppercase;
      z-index: 6;
      font-family: 'VT323', monospace;
    }

    /* Scanlines */
    .scanlines {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.35) 0px,
        rgba(0, 0, 0, 0.35) 1px,
        transparent 1px,
        transparent 3px
      );
      mix-blend-mode: multiply;
      opacity: 0.6;
    }
    .scanlines::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(108, 240, 136, 0) 0%,
        rgba(108, 240, 136, 0.06) 50%,
        rgba(108, 240, 136, 0) 100%);
      animation: sweep 5.5s linear infinite;
    }
    @keyframes sweep {
      0%   { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }

    /* Phosphor noise */
    .noise {
      position: absolute;
      inset: 0;
      z-index: 11;
      pointer-events: none;
      opacity: 0.10;
      mix-blend-mode: screen;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.6' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      animation: jitter 0.7s steps(6, end) infinite;
    }
    @keyframes jitter {
      0%   { transform: translate(0, 0); }
      20%  { transform: translate(-1px, 1px); }
      40%  { transform: translate(1px, -1px); }
      60%  { transform: translate(-1px, -1px); }
      80%  { transform: translate(1px, 1px); }
      100% { transform: translate(0, 0); }
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 12;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.85) 100%);
    }
    .edge-glow {
      position: absolute;
      inset: 0;
      z-index: 13;
      pointer-events: none;
      box-shadow: inset 0 0 100px rgba(108, 240, 136, 0.10);
    }

    @media (max-aspect-ratio: 1/1) {
      .vault-mark { left: 50%; top: 12%; transform: translateX(-50%); width: 50%; }
      .stats { right: 7%; left: 7%; top: auto; bottom: 18%; width: auto; }
      .top-bar { font-size: 12px; letter-spacing: 0.12em; }
      .footer-bar { font-size: 10px; letter-spacing: 0.12em; }
    }
  </style>
</head>
<body>
  <div data-composition-id="shire-preview" data-width="1280" data-height="982" data-duration="9" data-start="0" data-track-index="0">

    <div class="bezel"></div>

    <div class="top-bar">
      <span class="tab">STATS &nbsp;·&nbsp; INV &nbsp;·&nbsp; DATA &nbsp;·&nbsp; MAP &nbsp;·&nbsp; RADIO</span>
      <span class="meter">
        SIG
        <span class="bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
      </span>
    </div>

    <div class="vault-mark">
      <span class="label">VAULT</span>
      <span class="num">76</span>
      <span class="corner">SHIRE — STANDARD ISSUE</span>
    </div>

    <div class="stats">
      <h1>Shire</h1>
      <div class="sub">RobCo Industries — Pip-Companion Build</div>
      <div class="row"><span class="k">STATUS</span><span class="v">CURRENTLY BUILDING</span></div>
      <div class="row"><span class="k">CLASS</span><span class="v">UI / UX SYSTEM</span></div>
      <div class="row"><span class="k">RAD</span>
        <span class="bar"><i></i><i></i><i></i><i></i><i></i><i></i><i class="off"></i><i class="off"></i><i class="off"></i><i class="off"></i></span>
      </div>
      <div class="row"><span class="k">HP</span>
        <span class="bar"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="off"></i></span>
      </div>
      <div class="row"><span class="k">SYS</span><span class="v">ONLINE — 2026.05.24</span></div>
      <div class="row"><span class="k">AUTH</span><span class="v">Z. KABIR</span></div>
    </div>

    <div class="stand-by">▶ PLEASE STAND BY</div>

    <div class="footer-bar">
      <span>&gt; SHIRE.EXE RUNNING</span>
      <span>PIP-OS v2.6.2</span>
      <span>ROBCO© 2077</span>
    </div>

    <div class="scanlines"></div>
    <div class="noise"></div>
    <div class="edge-glow"></div>
    <div class="vignette"></div>
  </div>
</body>
</html>
