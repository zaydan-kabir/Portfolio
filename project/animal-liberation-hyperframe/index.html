<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animal Liberation, Indigeneity, and Morality — preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #14110d; }

    /* The expanding moral circle — the paper's own argument as its image.
       A core radiates outward through widening rings of obligation; a pulse
       sweeps out and each ring of beings lights as it is drawn inside the
       circle. Warm and earthen so it reads as a sibling to the Interstellar
       tile's cold observatory rather than a copy of it. */
    [data-composition-id="animal-liberation-preview"] {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      color: #ece3d2;
      font-family: 'Cormorant Garamond', 'Lora', Georgia, serif;
      background:
        radial-gradient(ellipse at 72% 50%, rgba(196,140,66,.20) 0%, transparent 52%),
        radial-gradient(ellipse at 8% 92%, rgba(120,74,38,.16) 0%, transparent 46%),
        linear-gradient(158deg, #1d1712 0%, #14110d 52%, #100d0a 100%);
      isolation: isolate;
    }

    /* ── The circle graphic — anchored right, bleeding off the edges ── */
    .orb {
      position: absolute;
      right: -9%;
      top: 50%;
      height: 152%;
      aspect-ratio: 1 / 1;
      transform: translateY(-50%);
      z-index: 2;
      pointer-events: none;
    }
    .orb svg { width: 100%; height: 100%; display: block; overflow: visible; }

    .ring {
      fill: none;
      stroke: rgba(226,190,136,.20);
      stroke-width: .9;
      transform-origin: 200px 200px;
      animation: breathe 11s ease-in-out infinite;
    }
    .ring.r2 { animation-delay: -1.4s; }
    .ring.r3 { animation-delay: -2.8s; stroke-dasharray: 3 7; stroke: rgba(226,190,136,.26); }
    .ring.r4 { animation-delay: -4.2s; }
    .ring.r5 { animation-delay: -5.6s; stroke-dasharray: 2 9; stroke: rgba(226,190,136,.17); }

    @keyframes breathe {
      0%, 100% { transform: scale(1);    opacity: 1; }
      50%      { transform: scale(1.018); opacity: .82; }
    }

    /* Faint radial spokes — the "architecture" holding the circle together */
    .spoke {
      stroke: rgba(226,190,136,.10);
      stroke-width: .7;
      transform-origin: 200px 200px;
      animation: spoke-turn 90s linear infinite;
    }
    @keyframes spoke-turn { to { transform: rotate(360deg); } }

    /* Beings on each ring. They sit dim until the pulse reaches them. */
    .ring-nodes circle {
      fill: #e8c48c;
      opacity: .26;
      animation: admit 6s ease-in-out infinite;
    }
    .ring-nodes.r1 circle { animation-delay: 1.25s; }
    .ring-nodes.r2 circle { animation-delay: 2.25s; }
    .ring-nodes.r3 circle { animation-delay: 3.25s; }
    .ring-nodes.r4 circle { animation-delay: 4.25s; }
    .ring-nodes.r5 circle { animation-delay: 5.20s; }

    @keyframes admit {
      0%      { opacity: .26; filter: none; }
      6%      { opacity: 1;   filter: drop-shadow(0 0 5px rgba(240,205,150,.95)); }
      34%     { opacity: .58; filter: drop-shadow(0 0 2px rgba(240,205,150,.35)); }
      100%    { opacity: .26; filter: none; }
    }

    /* The sweep itself */
    .pulse {
      fill: none;
      stroke: rgba(245,214,160,.55);
      stroke-width: 1.1;
      transform-origin: 200px 200px;
      animation: sweep 6s cubic-bezier(.34,.64,.4,1) infinite;
    }
    @keyframes sweep {
      0%   { r: 14;  opacity: 0; }
      8%   { opacity: .75; }
      88%  { opacity: 0; }
      100% { r: 205; opacity: 0; }
    }

    /* The core — the moral "here" the circle expands from */
    .core {
      fill: #f6ddb0;
      animation: core-beat 6s ease-in-out infinite;
    }
    .core-glow {
      fill: rgba(238,190,116,.20);
      animation: core-halo 6s ease-in-out infinite;
    }
    @keyframes core-beat {
      0%, 100% { opacity: .88; }
      4%       { opacity: 1; }
      52%      { opacity: .76; }
    }
    @keyframes core-halo {
      0%, 100% { transform: scale(1);   opacity: .5; }
      6%       { transform: scale(1.5); opacity: .9; }
      60%      { transform: scale(1);   opacity: .4; }
    }
    .core, .core-glow { transform-origin: 200px 200px; }

    /* ── Editorial chrome ─────────────────────────────────────── */
    .frame {
      position: relative;
      z-index: 4;
      width: 100%;
      height: 100%;
      padding: clamp(14px, 4.4vh, 40px) clamp(16px, 4vw, 48px);
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .kicker {
      display: flex;
      align-items: center;
      gap: .62em;
      font-family: 'Lora', Georgia, serif;
      font-size: clamp(7.5px, 1.55vw, 12px);
      letter-spacing: .26em;
      text-transform: uppercase;
      color: rgba(236,227,210,.72);
      white-space: nowrap;
    }
    .kicker::before {
      content: "";
      width: .5em; height: .5em;
      border-radius: 50%;
      background: #eec06e;
      box-shadow: 0 0 8px rgba(238,192,110,.9);
      flex: none;
      animation: core-beat 6s ease-in-out infinite;
    }

    .lede {
      align-self: center;
      max-width: min(58%, 30em);
      padding-right: 1em;
    }
    .lede h1 {
      margin: 0;
      font-weight: 600;
      font-size: clamp(17px, 5vw, 46px);
      line-height: 1.03;
      letter-spacing: -0.004em;
      color: #f4ece0;
      text-wrap: balance;
    }
    .lede h1 em {
      font-style: italic;
      font-weight: 500;
      color: #e6b878;
    }
    .lede .byline {
      margin-top: clamp(5px, 1.5vh, 14px);
      font-family: 'Lora', Georgia, serif;
      font-style: italic;
      font-size: clamp(7.5px, 1.62vw, 13px);
      line-height: 1.45;
      color: rgba(236,227,210,.56);
      max-width: 26em;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1.4em;
      font-family: 'Lora', Georgia, serif;
      font-size: clamp(7px, 1.45vw, 11.5px);
      color: rgba(236,227,210,.5);
      white-space: nowrap;
    }
    .footer .cat { font-style: italic; }
    .footer .meta {
      letter-spacing: .2em;
      text-transform: uppercase;
      font-size: .92em;
      color: rgba(236,227,210,.38);
    }

    /* Paper grain, kept faint so it warms the dark without muddying it */
    .grain {
      position: absolute; inset: 0;
      pointer-events: none;
      opacity: .05;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 170px 170px;
      z-index: 6;
    }

    /* Vignette pulls the eye back to the title block */
    .vignette {
      position: absolute; inset: 0;
      pointer-events: none;
      z-index: 3;
      background: radial-gradient(ellipse at 26% 52%, rgba(16,13,10,.66) 0%, rgba(16,13,10,.28) 34%, transparent 62%);
    }

    /* Narrow tiles (the playground shrinks this frame on small screens):
       drop the byline and let the title and circle carry it. */
    @media (max-width: 380px) {
      .lede { max-width: 62%; }
      .lede .byline { display: none; }
      .orb { right: -16%; height: 132%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ring, .spoke, .pulse, .core, .core-glow,
      .ring-nodes circle, .kicker::before { animation: none; }
      .ring-nodes circle { opacity: .7; }
    }
  </style>
</head>
