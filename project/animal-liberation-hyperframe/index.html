<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animal Liberation, Indigeneity, and Morality — preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #efeae0; }

    [data-composition-id="animal-liberation-preview"] {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      color: #1a1815;
      font-family: 'Cormorant Garamond', 'Lora', Georgia, serif;
      background:
        radial-gradient(ellipse at 18% 8%, rgba(120,80,40,.10) 0%, transparent 38%),
        radial-gradient(ellipse at 88% 92%, rgba(60,40,20,.09) 0%, transparent 42%),
        linear-gradient(180deg, #f4efe4 0%, #ece5d5 100%);
      isolation: isolate;
    }

    /* Faint paper grain */
    .grain {
      position: absolute; inset: 0;
      pointer-events: none;
      opacity: .07;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      z-index: 1;
    }

    .composition {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      padding: clamp(28px, 5vw, 68px) clamp(32px, 6vw, 80px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: clamp(10px, 1.6vw, 22px);
    }

    .masthead {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      font-family: 'Lora', Georgia, serif;
      font-size: clamp(10px, .9vw, 13px);
      letter-spacing: .26em;
      text-transform: uppercase;
      color: #4a3f2c;
      border-bottom: 1px solid rgba(40,30,18,.28);
      padding-bottom: clamp(8px, 1vw, 14px);
    }

    .masthead .vol {
      font-style: italic;
      letter-spacing: .14em;
      text-transform: none;
      color: rgba(40,30,18,.62);
    }

    .body {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: clamp(18px, 3vw, 42px);
      align-items: start;
    }

    .lede h1 {
      font-family: 'Cormorant Garamond', 'Lora', Georgia, serif;
      font-weight: 700;
      font-size: clamp(22px, 3.4vw, 54px);
      line-height: 1.05;
      letter-spacing: -0.005em;
      margin: 0;
      color: #15120e;
    }
    .lede h1 em {
      font-style: italic;
      font-weight: 500;
      color: #3b2d18;
    }

    .lede .byline {
      margin-top: clamp(8px, 1.2vw, 16px);
      font-family: 'Lora', Georgia, serif;
      font-style: italic;
      font-size: clamp(11px, 1vw, 14px);
      color: rgba(40,30,18,.7);
    }

    /* Suggested column of text — animated rules */
    .columns {
      display: grid;
      gap: clamp(6px, 1vw, 12px);
      padding-top: clamp(4px, .6vw, 10px);
    }
    .columns .rule {
      height: 2px;
      background: linear-gradient(90deg, rgba(40,30,18,.42), rgba(40,30,18,0));
      border-radius: 1px;
      transform-origin: left center;
      animation: scan 5.6s ease-in-out infinite;
    }
    .columns .rule:nth-child(2)  { animation-delay: .35s; opacity: .9; }
    .columns .rule:nth-child(3)  { animation-delay: .70s; opacity: .82; }
    .columns .rule:nth-child(4)  { animation-delay: 1.05s; opacity: .76; width: 92%; }
    .columns .rule:nth-child(5)  { animation-delay: 1.40s; opacity: .70; width: 78%; }
    .columns .rule:nth-child(6)  { animation-delay: 1.75s; opacity: .64; width: 88%; }
    .columns .rule:nth-child(7)  { animation-delay: 2.10s; opacity: .58; width: 64%; }
    .columns .rule:nth-child(8)  { animation-delay: 2.45s; opacity: .52; width: 84%; }
    .columns .rule:nth-child(9)  { animation-delay: 2.80s; opacity: .48; width: 72%; }
    .columns .rule:nth-child(10) { animation-delay: 3.15s; opacity: .42; width: 56%; }

    @keyframes scan {
      0%, 100% { transform: scaleX(.94); filter: brightness(1); }
      50%      { transform: scaleX(1.0); filter: brightness(1.08); }
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: 'Lora', Georgia, serif;
      font-style: italic;
      font-size: clamp(10px, .85vw, 13px);
      letter-spacing: .04em;
      color: rgba(40,30,18,.68);
      border-top: 1px solid rgba(40,30,18,.18);
      padding-top: clamp(8px, 1vw, 14px);
    }

    .footer .tag {
      font-style: normal;
      letter-spacing: .22em;
      text-transform: uppercase;
      font-size: clamp(9px, .75vw, 11px);
      color: rgba(40,30,18,.58);
    }

    @media (max-width: 700px) {
      .body { grid-template-columns: 1fr; }
      .columns { display: none; }
      .masthead { font-size: 10px; letter-spacing: .2em; }
    }
  </style>
</head>
<body>
  <div data-composition-id="animal-liberation-preview">
    <div class="grain"></div>
    <div class="composition">
      <div class="masthead">
        <span>Stanford Political Review</span>
        <span class="vol">Vol. XXVI &middot; Spring 2026</span>
      </div>
      <div class="body">
        <div class="lede">
          <h1>Animal&nbsp;Liberation, <em>Indigeneity</em>, and Morality</h1>
          <div class="byline">A paper on the moral architecture binding species, sovereignty, and stewardship.</div>
        </div>
        <div class="columns" aria-hidden="true">
          <div class="rule"></div>
          <div class="rule"></div>
          <div class="rule"></div>
          <div class="rule"></div>
          <div class="rule"></div>
          <div class="rule"></div>
          <div class="rule"></div>
          <div class="rule"></div>
          <div class="rule"></div>
          <div class="rule"></div>
        </div>
      </div>
      <div class="footer">
        <span>Social Justice &amp; Law</span>
        <span class="tag">Read at SPR</span>
      </div>
    </div>
  </div>
</body>
</html>
