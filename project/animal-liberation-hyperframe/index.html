<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animal Liberation, Indigeneity, and Morality &mdash; preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #14110d; }

    /* The essay's three terms, drawn rather than diagrammed:
         STEWARDSHIP  the land itself, as survey contours — ground known by
                      its shape, continuous and indifferent to ownership.
         SOVEREIGNTY  a surveyed boundary ruled straight across that ground,
                      dashed and tick-marked like a treaty line on a map.
         SPECIES      trails of animal tracks that walk over the line as if
                      it were not there.
       The tracks are the argument: the border is the human abstraction, the
       animals and the land are the prior fact it was drawn on top of. */
    [data-composition-id="animal-liberation-preview"] {
      position: relative;
      width: 100vw; height: 100vh; overflow: hidden;
      color: #ece3d2;
      font-family: 'Cormorant Garamond', 'Lora', Georgia, serif;
      background:
        radial-gradient(ellipse at 68% 56%, rgba(176,126,60,.17) 0%, transparent 55%),
        radial-gradient(ellipse at 12% 8%, rgba(108,68,34,.14) 0%, transparent 48%),
        linear-gradient(158deg, #1e1813 0%, #15110d 54%, #100d0a 100%);
      isolation: isolate;
    }

    .plate { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
    .plate svg { width: 100%; height: 100%; display: block; }

    /* ── Land ───────────────────────────────────────────────── */
    .contour {
      fill: none;
      stroke: rgba(214,178,126,.19);
      stroke-width: .85;
    }
    .contour.c1 { stroke: rgba(214,178,126,.30); }
    .contour.c2 { stroke: rgba(214,178,126,.26); }
    .contour.c5 { stroke: rgba(214,178,126,.15); }
    .contour.c6 { stroke: rgba(214,178,126,.11); }

    /* ── The surveyed boundary ──────────────────────────────── */
    .border-line {
      fill: none;
      stroke: rgba(232,196,140,.62);
      stroke-width: 1.5;
      stroke-dasharray: 13 9;
      animation: survey 14s linear infinite;
    }
    @keyframes survey { to { stroke-dashoffset: -220; } }

    .tick { stroke: rgba(232,196,140,.42); stroke-width: 1.2; }
    .cairn { fill: rgba(240,208,152,.72); }
    .cairn-ring {
      fill: none; stroke: rgba(240,208,152,.5); stroke-width: 1;
      transform-origin: center;
      animation: cairn-pulse 5.5s ease-out infinite;
    }
    @keyframes cairn-pulse {
      0%   { r: 3.5; opacity: .85; }
      70%  { r: 15;  opacity: 0; }
      100% { r: 15;  opacity: 0; }
    }

    /* ── Tracks crossing it ─────────────────────────────────── */
    #hoof ellipse { fill: #f3d6a6; }
    .trail use {
      opacity: 0;
      animation: step 9s ease-in-out infinite;
    }
    .trail.t2 use { animation-duration: 10.5s; animation-delay: 0s; }
    .trail.t3 use { animation-duration: 11.5s; }
    /* stagger per-track comes from inline animation-delay; these shift whole trails */
    .trail.t2 { animation: none; }

    @keyframes step {
      0%   { opacity: 0; }
      6%   { opacity: .95; }
      52%  { opacity: .72; }
      74%  { opacity: 0; }
      100% { opacity: 0; }
    }

    /* ── Editorial chrome ───────────────────────────────────── */
    .frame {
      position: relative; z-index: 4; width: 100%; height: 100%;
      padding: clamp(14px, 4.4vh, 40px) clamp(16px, 4vw, 48px);
      display: grid; grid-template-rows: auto 1fr auto;
    }
    .kicker {
      display: flex; align-items: center; gap: .62em;
      font-family: 'Lora', Georgia, serif;
      font-size: clamp(7.5px, 1.55vw, 12px);
      letter-spacing: .26em; text-transform: uppercase;
      color: rgba(236,227,210,.72); white-space: nowrap;
    }
    .kicker::before {
      content: ""; width: .5em; height: .5em; border-radius: 50%;
      background: #eec06e; box-shadow: 0 0 8px rgba(238,192,110,.9); flex: none;
    }
    .lede { align-self: center; max-width: min(56%, 29em); padding-right: 1em; }
    .lede h1 {
      margin: 0; font-weight: 600;
      font-size: clamp(17px, 4.9vw, 45px);
      line-height: 1.03; letter-spacing: -0.004em;
      color: #f4ece0; text-wrap: balance;
    }
    .lede h1 em { font-style: italic; font-weight: 500; color: #e6b878; }
    .lede .byline {
      margin-top: clamp(5px, 1.5vh, 14px);
      font-family: 'Lora', Georgia, serif; font-style: italic;
      font-size: clamp(7.5px, 1.62vw, 13px); line-height: 1.45;
      color: rgba(236,227,210,.56); max-width: 26em;
    }
    .footer {
      display: flex; justify-content: space-between; align-items: baseline; gap: 1.4em;
      font-family: 'Lora', Georgia, serif;
      font-size: clamp(7px, 1.45vw, 11.5px);
      color: rgba(236,227,210,.5); white-space: nowrap;
    }
    .footer .cat { font-style: italic; }
    .footer .meta {
      letter-spacing: .2em; text-transform: uppercase;
      font-size: .92em; color: rgba(236,227,210,.38);
    }

    .vignette {
      position: absolute; inset: 0; pointer-events: none; z-index: 3;
      background: radial-gradient(ellipse at 24% 52%, rgba(16,13,10,.72) 0%, rgba(16,13,10,.34) 36%, transparent 64%);
    }
    .grain {
      position: absolute; inset: 0; pointer-events: none;
      opacity: .05; mix-blend-mode: overlay; z-index: 6;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 170px 170px;
    }

    @media (max-width: 380px) {
      .lede { max-width: 60%; }
      .lede .byline { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .border-line, .cairn-ring, .trail use { animation: none; }
      .trail use { opacity: .8; }
    }
  </style>
</head>
