<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcane Typeface HyperFrame Preview</title>
  <style>
    @font-face {
      font-family: 'Arcane';
      src: url('../uploads/Arcane.otf') format('opentype'),
           url('../uploads/Arcane.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: block;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0E0E0E; }

    [data-composition-id="arcane-typeface-preview"] {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 42%, #353938 0%, #1D2224 60%, #0E0E0E 100%);
      color: #a8b0ac;
      font-family: 'Arcane', serif;
      isolation: isolate;
    }

    /* Corner triangles */
    .tri {
      position: absolute;
      width: 5.5%;
      aspect-ratio: 1;
      z-index: 4;
      will-change: transform;
    }
    .tri svg { width: 100%; height: 100%; overflow: visible; }
    .tri svg polygon { fill: none; stroke: #7A827D; stroke-width: 3; }
    .tri.tl { top: 7%;  left: 7%; }
    .tri.tr { top: 7%;  right: 7%; }
    .tri.bl { bottom: 7%; left: 7%; }
    .tri.br { bottom: 7%; right: 7%; }

    /* Centered stack */
    .stack {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 3vh, 36px);
      padding: clamp(40px, 10vh, 100px) 6%;
      z-index: 5;
    }

    .hero {
      position: relative;
      font-family: 'Arcane', serif;
      font-size: clamp(80px, 17vw, 240px);
      letter-spacing: 0.05em;
      line-height: 0.9;
      color: #a8b0ac;
      text-transform: uppercase;
      white-space: nowrap;
      text-align: center;
      text-shadow: 0 0 36px rgba(122, 130, 125, 0.22);
    }
    .hero .l { display: inline-block; will-change: transform, opacity; }

    .specimen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(4px, 0.8vh, 10px);
    }
    .specimen .row {
      font-family: 'Arcane', serif;
      font-size: clamp(20px, 3.2vw, 42px);
      letter-spacing: 0.16em;
      color: #7A827D;
      white-space: nowrap;
      line-height: 1;
    }
    .specimen .row.upper { text-transform: uppercase; }
    .specimen .row.lower { text-transform: lowercase; }
    .specimen .row .l { display: inline-block; will-change: transform, opacity; }

    /* Corner mono labels */
    .meta {
      position: absolute;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: clamp(8px, 0.78vw, 11px);
      letter-spacing: 0.18em;
      line-height: 1.4;
      color: #5e6562;
      z-index: 7;
      text-transform: uppercase;
    }
    .meta.tl { left: 16%; top: 6.5%; }
    .meta.tr { right: 16%; top: 6.5%; text-align: right; }
    .meta.bl { left: 16%; bottom: 6.5%; }
    .meta.br { right: 16%; bottom: 6.5%; text-align: right; }
    .meta .em { color: #a8b0ac; font-weight: 600; }

    .grain {
      position: absolute;
      inset: 0;
      z-index: 12;
      pointer-events: none;
      opacity: 0.10;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 220px 220px;
    }
    .vignette {
      position: absolute;
      inset: 0;
      z-index: 11;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.6) 100%);
    }
  </style>
</head>
<body>
  <div data-composition-id="arcane-typeface-preview" data-width="982" data-height="1280" data-duration="11" data-start="0" data-track-index="0">

    <div class="tri tl"><svg viewBox="0 0 100 100"><polygon points="50,8 92,90 8,90"/></svg></div>
    <div class="tri tr"><svg viewBox="0 0 100 100"><polygon points="50,92 92,10 8,10"/></svg></div>
    <div class="tri bl"><svg viewBox="0 0 100 100"><polygon points="50,8 92,90 8,90"/></svg></div>
    <div class="tri br"><svg viewBox="0 0 100 100"><polygon points="50,92 92,10 8,10"/></svg></div>

    <div class="stack">
      <div class="hero">
        <span class="main">
          <span class="l">A</span><span class="l">R</span><span class="l">C</span><span class="l">A</span><span class="l">N</span><span class="l">E</span>
        </span>
      </div>

      <div class="specimen">
        <div class="row upper line-1">
          <span class="l">A</span><span class="l">B</span><span class="l">C</span><span class="l">D</span><span class="l">E</span><span class="l">F</span><span class="l">G</span><span class="l">H</span><span class="l">I</span><span class="l">J</span><span class="l">K</span><span class="l">L</span><span class="l">M</span><span class="l">N</span>
        </div>
        <div class="row upper line-2">
          <span class="l">O</span><span class="l">P</span><span class="l">Q</span><span class="l">R</span><span class="l">S</span><span class="l">T</span><span class="l">U</span><span class="l">V</span><span class="l">W</span><span class="l">X</span><span class="l">Y</span><span class="l">Z</span>
        </div>
        <div class="row lower line-3">
          <span class="l">a</span><span class="l">b</span><span class="l">c</span><span class="l">d</span><span class="l">e</span><span class="l">f</span><span class="l">g</span><span class="l">h</span><span class="l">i</span><span class="l">j</span><span class="l">k</span><span class="l">l</span><span class="l">m</span><span class="l">n</span>
        </div>
        <div class="row lower line-4">
          <span class="l">o</span><span class="l">p</span><span class="l">q</span><span class="l">r</span><span class="l">s</span><span class="l">t</span><span class="l">u</span><span class="l">v</span><span class="l">w</span><span class="l">x</span><span class="l">y</span><span class="l">z</span>
        </div>
      </div>
    </div>

    <div class="meta tl">Specimen V<br><span class="em">Plate 02</span></div>
    <div class="meta tr">Display<br><span class="em">©2026 ZKA</span></div>
    <div class="meta bl">Typeface — Arcane<br><span class="em">designed by Z. Kabir</span></div>
    <div class="meta br">Edition — Open<br><span class="em">v 0.1</span></div>

    <div class="vignette"></div>
    <div class="grain"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Triangles snap in
      tl.from('.tri', { scale: 0, opacity: 0, duration: 0.55, ease: 'back.out(2.2)', stagger: 0.07 }, 0.1);

      // Hero letters drop
      tl.from('.hero .main .l', { y: -120, opacity: 0, duration: 0.6, ease: 'expo.out', stagger: 0.07 }, 0.4);

      // Specimen rows stagger
      tl.from('.line-1 .l', { y: -18, opacity: 0, duration: 0.38, ease: 'expo.out', stagger: 0.02 }, 1.35)
        .from('.line-2 .l', { y: -18, opacity: 0, duration: 0.38, ease: 'expo.out', stagger: 0.02 }, 1.55)
        .from('.line-3 .l', { y:  18, opacity: 0, duration: 0.38, ease: 'expo.out', stagger: 0.02 }, 1.75)
        .from('.line-4 .l', { y:  18, opacity: 0, duration: 0.38, ease: 'expo.out', stagger: 0.02 }, 1.95);

      // Corner meta
      tl.from('.meta.tl', { x: -10, opacity: 0, duration: 0.5, ease: 'power2.out' }, 2.35)
        .from('.meta.tr', { x:  10, opacity: 0, duration: 0.5, ease: 'power2.out' }, 2.41)
        .from('.meta.bl', { y:  10, opacity: 0, duration: 0.5, ease: 'power2.out' }, 2.47)
        .from('.meta.br', { y:  10, opacity: 0, duration: 0.5, ease: 'power2.out' }, 2.53);

      // Idle motion
      tl.to('.tri.tl', { rotation:  360, duration: 8, ease: 'none' }, 2.8)
        .to('.tri.tr', { rotation: -360, duration: 8, ease: 'none' }, 2.8)
        .to('.tri.bl', { rotation: -360, duration: 8, ease: 'none' }, 2.8)
        .to('.tri.br', { rotation:  360, duration: 8, ease: 'none' }, 2.8);

      tl.to('.hero .main', { y: -3, duration: 4, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 2.8)
        .to('.specimen',   { y: -2, duration: 4, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 2.8);

      window.__timelines['arcane-typeface-preview'] = tl;

      if (!window.__hyperframes) {
        tl.eventCallback('onComplete', () => tl.restart());
        tl.play(0);
      }
    </script>
  </div>
</body>
</html>
