<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typeface — Arcane HyperFrame Preview</title>
  <style>
    @font-face {
      font-family: 'ZKA Arcane';
      src: url('../uploads/ZKAFont.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: block;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #d9cdb0; }

    [data-composition-id="arcane-typeface-preview"] {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 45%, #ede2c5 0%, #d9cdb0 65%, #c4b692 100%);
      color: #1a2540;
      font-family: 'ZKA Arcane', 'Major Mono Display', 'Courier New', monospace;
      isolation: isolate;
    }

    /* Triangles top + bottom corners (from the poster vocabulary) */
    .tri {
      position: absolute;
      width: 6.5%;
      aspect-ratio: 1;
      z-index: 4;
      will-change: transform;
    }
    .tri svg { width: 100%; height: 100%; overflow: visible; }
    .tri svg polygon { fill: none; stroke: #1a2540; stroke-width: 2.5; }
    .tri.up    { top: 7%;  left: 7%; }
    .tri.down  { top: 7%;  right: 7%; }
    .tri.up-b  { bottom: 7%; left: 7%; }
    .tri.down-b{ bottom: 7%; right: 7%; }

    /* Centered stack containing the hero + specimen */
    .stack {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 4vh, 48px);
      padding: clamp(40px, 12vh, 120px) 5%;
      z-index: 5;
    }

    /* HERO wordmark in the actual ZKA Arcane font */
    .hero {
      position: relative;
      text-align: center;
      font-family: 'ZKA Arcane', serif;
      font-size: clamp(72px, 16vw, 220px);
      letter-spacing: 0.06em;
      line-height: 0.9;
      color: #1a2540;
      white-space: nowrap;
      text-transform: uppercase;
    }
    .hero .l {
      display: inline-block;
      will-change: transform, opacity;
    }

    /* Specimen rows showing the full set */
    .specimen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(6px, 1.2vh, 14px);
    }
    .specimen .row {
      font-family: 'ZKA Arcane', serif;
      font-size: clamp(20px, 3.4vw, 44px);
      letter-spacing: 0.18em;
      color: #1a2540;
      white-space: nowrap;
      line-height: 1;
    }
    .specimen .row.upper { text-transform: uppercase; }
    .specimen .row.lower { text-transform: lowercase; }
    .specimen .row .l {
      display: inline-block;
      will-change: transform, opacity;
    }

    /* Mono meta labels in corners */
    .meta {
      position: absolute;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: clamp(8px, 0.78vw, 11px);
      letter-spacing: 0.12em;
      line-height: 1.4;
      color: rgba(26,37,64,.7);
      z-index: 7;
      text-transform: uppercase;
    }
    .meta.tl { left: 16%; top: 6.2%; }
    .meta.tr { right: 16%; top: 6.2%; text-align: right; }
    .meta.bl { left: 16%; bottom: 6.2%; }
    .meta.br { right: 16%; bottom: 6.2%; text-align: right; }
    .meta .em { color: #1a2540; font-weight: 600; }

    /* Risograph grain + vignette */
    .grain {
      position: absolute;
      inset: 0;
      z-index: 12;
      pointer-events: none;
      opacity: 0.2;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 220px 220px;
    }
    .vignette {
      position: absolute;
      inset: 0;
      z-index: 11;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(80,55,30,.20) 100%);
    }

    /* Red ink registration ghost on the hero */
    .hero .ghost {
      position: absolute;
      left: 0; right: 0; top: 0;
      color: #c1281d;
      mix-blend-mode: multiply;
      opacity: 0.25;
      transform: translate(3px, 2px);
      pointer-events: none;
      will-change: transform, opacity;
    }

    @media (max-aspect-ratio: 1/1) {
      .hero { font-size: clamp(56px, 18vw, 160px); }
      .specimen .row { font-size: clamp(16px, 4.6vw, 32px); }
      .meta { font-size: 9px; }
      .meta.tl, .meta.bl { left: 6%; }
      .meta.tr, .meta.br { right: 6%; }
    }
  </style>
</head>
<body>
  <div data-composition-id="arcane-typeface-preview" data-width="982" data-height="1280" data-duration="11" data-start="0" data-track-index="0">

    <div class="tri up">     <svg viewBox="0 0 100 100"><polygon points="50,8 92,90 8,90"/></svg></div>
    <div class="tri down">   <svg viewBox="0 0 100 100"><polygon points="50,92 92,10 8,10"/></svg></div>
    <div class="tri up-b">   <svg viewBox="0 0 100 100"><polygon points="50,8 92,90 8,90"/></svg></div>
    <div class="tri down-b"> <svg viewBox="0 0 100 100"><polygon points="50,92 92,10 8,10"/></svg></div>

    <div class="stack">
      <div class="hero">
        <span class="layer main">
          <span class="l">A</span><span class="l">R</span><span class="l">C</span><span class="l">A</span><span class="l">N</span><span class="l">E</span>
        </span>
        <span class="ghost" aria-hidden="true">ARCANE</span>
      </div>

      <div class="specimen">
      <div class="row upper line-1">
        <span class="l">A</span><span class="l">B</span><span class="l">C</span><span class="l">D</span><span class="l">E</span><span class="l">F</span><span class="l">G</span><span class="l">H</span><span class="l">I</span><span class="l">J</span><span class="l">K</span><span class="l">L</span><span class="l">M</span><span class="l">N</span>
      </div>
      <div class="row upper line-2">
        <span class="l">O</span><span class="l">P</span><span class="l">Q</span><span class="l">R</span><span class="l">S</span><span class="l">T</span><span class="l">U</span><span class="l">V</span><span class="l">W</span><span class="l">X</span><span class="l">Y</span><span class="l">Z</span>
      </div>
      <div class="row lower line-3">
        <span class="l">a</span><span class="l">b</span><span class="l">c</span><span class="l">d</span><span class="l">e</span><span class="l">f</span><span class="l">g</span><span class="l">h</span><span class="l">i</span><span class="l">j</span><span class="l">k</span><span class="l">l</span><span class="l">m</span><span class="l">n</span>
      </div>
      <div class="row lower line-4">
        <span class="l">o</span><span class="l">p</span><span class="l">q</span><span class="l">r</span><span class="l">s</span><span class="l">t</span><span class="l">u</span><span class="l">v</span><span class="l">w</span><span class="l">x</span><span class="l">y</span><span class="l">z</span>
      </div>
      </div>
    </div>

    <div class="meta tl">Specimen 05<br><span class="em">Plate 02</span></div>
    <div class="meta tr">Display / Display<br><span class="em">©2026 ZKA</span></div>
    <div class="meta bl">Typeface — Arcane<br><span class="em">designed by Z. Kabir</span></div>
    <div class="meta br">Edition / Open<br><span class="em">v 0.1</span></div>

    <div class="vignette"></div>
    <div class="grain"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Triangles snap in from corners
      tl.from('.tri', {
        scale: 0, opacity: 0,
        duration: 0.6, ease: 'back.out(2.2)',
        stagger: 0.08
      }, 0.1);

      // Hero ARCANE letters drop in one by one
      tl.from('.hero .main .l', {
        y: -120, opacity: 0,
        duration: 0.65, ease: 'expo.out',
        stagger: 0.07
      }, 0.4);

      // Red ink registration drifts in
      tl.from('.hero .ghost', {
        opacity: 0, x: 0, y: 0,
        duration: 0.6, ease: 'sine.out'
      }, 0.95);

      // Specimen rows reveal
      tl.from('.line-1 .l', { y: -20, opacity: 0, duration: 0.4, ease: 'expo.out', stagger: 0.022 }, 1.4)
        .from('.line-2 .l', { y: -20, opacity: 0, duration: 0.4, ease: 'expo.out', stagger: 0.022 }, 1.6)
        .from('.line-3 .l', { y:  20, opacity: 0, duration: 0.4, ease: 'expo.out', stagger: 0.022 }, 1.8)
        .from('.line-4 .l', { y:  20, opacity: 0, duration: 0.4, ease: 'expo.out', stagger: 0.022 }, 2.0);

      // Corner meta
      tl.from('.meta.tl', { x: -10, opacity: 0, duration: 0.5, ease: 'power2.out' }, 2.4)
        .from('.meta.tr', { x:  10, opacity: 0, duration: 0.5, ease: 'power2.out' }, 2.46)
        .from('.meta.bl', { y:  10, opacity: 0, duration: 0.5, ease: 'power2.out' }, 2.52)
        .from('.meta.br', { y:  10, opacity: 0, duration: 0.5, ease: 'power2.out' }, 2.58);

      // Idle: triangles slowly rotate; hero breathes; ghost drifts
      tl.to('.tri.up',     { rotation:  360, duration: 8, ease: 'none' }, 2.8)
        .to('.tri.down',   { rotation: -360, duration: 8, ease: 'none' }, 2.8)
        .to('.tri.up-b',   { rotation: -360, duration: 8, ease: 'none' }, 2.8)
        .to('.tri.down-b', { rotation:  360, duration: 8, ease: 'none' }, 2.8);

      tl.to('.hero .main', { y: -4, duration: 4, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 2.8);
      tl.to('.hero .ghost', { x: 6, y: 4, duration: 4, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 2.8);
      tl.to('.specimen', { y: -3, duration: 4, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 2.8);

      window.__timelines['arcane-typeface-preview'] = tl;

      if (!window.__hyperframes) {
        tl.eventCallback('onComplete', () => tl.restart());
        tl.play(0);
      }
    </script>
  </div>
</body>
</html>
