<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Zaydan — Playground</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #0a0a0a;
      --ink: #f0f0f0;
      --muted: rgba(240,240,240,.58);
      --gray2: #8a8a8a;
      --gray3: #2a2a2a;
      --tile: #141414;
      --tile-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 18px 30px rgba(0,0,0,.34);
      --label-bg: rgba(240,240,240,.94);
      --label-ink: #0a0a0a;
      --label-muted: rgba(10,10,10,.62);
      --label-border: rgba(255,255,255,.22);
      --label-shadow: 0 12px 26px rgba(0,0,0,.28);
      --trail-rgb: 240,240,240;
      --grid-line: rgba(240,240,240,.14);
    }
    html[data-theme="light"] {
      --paper: #f0f0f0;
      --ink: #0a0a0a;
      --muted: rgba(10,10,10,.62);
      --gray2: #666;
      --gray3: #cfcfcf;
      --tile: #e4e4e4;
      --tile-shadow: 0 0 0 1px rgba(10,10,10,.08), 0 18px 30px rgba(10,10,10,.12);
      --label-bg: rgba(10,10,10,.92);
      --label-ink: #f0f0f0;
      --label-muted: rgba(240,240,240,.68);
      --label-border: rgba(10,10,10,.2);
      --label-shadow: 0 12px 28px rgba(10,10,10,.18);
      --trail-rgb: 10,10,10;
      --grid-line: rgba(10,10,10,.14);
    }
    html[data-theme="dark"] {
      --paper: #0a0a0a;
      --ink: #f0f0f0;
      --muted: rgba(240,240,240,.58);
      --gray2: #8a8a8a;
      --gray3: #2a2a2a;
      --tile: #141414;
      --tile-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 18px 30px rgba(0,0,0,.34);
      --label-bg: rgba(240,240,240,.94);
      --label-ink: #0a0a0a;
      --label-muted: rgba(10,10,10,.62);
      --label-border: rgba(255,255,255,.22);
      --label-shadow: 0 12px 26px rgba(0,0,0,.28);
      --trail-rgb: 240,240,240;
      --grid-line: rgba(240,240,240,.14);
    }

    html { width: 100%; height: 100%; background: var(--paper); scrollbar-width: none; overscroll-behavior: none; }
    html::-webkit-scrollbar { display: none; }
    body {
      width: 100%; height: 100%; background: var(--paper); font-family: 'Lora', Georgia, serif;
      color: var(--ink); overflow: hidden; cursor: none; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }
    a, a:hover, a:active, button, button:hover { cursor: none !important; }

    #safe-area-top {
      position: fixed; left: 0; right: 0; top: calc(-1 * env(safe-area-inset-top, 0px));
      height: calc(env(safe-area-inset-top, 0px) * 2); background: var(--paper); z-index: 2000;
      pointer-events: none; -webkit-transform: translateZ(0); transform: translateZ(0);
    }
    #cursor {
      position: fixed; top: 0; left: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--ink);
      pointer-events: none; transform: translate(-50%, -50%); z-index: 9999;
    }
    body #theme-toggle { padding: 2px; }
    body #theme-toggle button { padding: 2px 7px 3px; }
    #trail-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 9997; }
    html[data-theme="light"] body #trail-canvas,
    html[data-theme="dark"] body #trail-canvas {
      filter: none !important;
    }
    #page-out {
      position: fixed; inset: 0; background: var(--ink); z-index: 8888; transform: scaleY(0); transform-origin: bottom;
      transition: transform 0.45s cubic-bezier(.76,0,.24,1);
    }
    #page-out.covering  { transform: scaleY(1); transform-origin: bottom; }
    #page-out.revealing { transform: scaleY(0); transform-origin: top; transition: transform 0.45s cubic-bezier(.76,0,.24,1) 0.05s; }

    #header {
      position: fixed; left: 0; right: 0; z-index: 1000; display: flex; align-items: baseline; justify-content: space-between;
      border-bottom: 1px solid var(--gray3); background: var(--paper); -webkit-transform: translateZ(0); transform: translateZ(0);
      will-change: transform; top: calc(-1 * env(safe-area-inset-top, 0px)); padding: calc(env(safe-area-inset-top, 0px) + 24px) 48px 10px;
    }
    .h-name {
      font-family: 'Lora', serif; font-size: 14px; font-weight: 400; letter-spacing: -0.01em;
      color: var(--gray2); text-decoration: none; transition: color .2s;
    }
    .h-name:hover, .h-name.active { color: var(--ink); }
    .h-nav { display: flex; gap: 28px; align-items: baseline; }
    .h-link {
      font-family: 'Lora', serif; font-size: 13px; font-weight: 300; font-style: italic; color: var(--gray2);
      text-decoration: none; letter-spacing: .02em; position: relative; transition: color .2s;
    }
    .h-link::after {
      content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 1px;
      background: var(--ink); transform: scaleX(0); transition: transform .2s ease;
    }
    .h-link:hover, .h-link.active { color: var(--ink); }
    .h-link:hover::after, .h-link.active::after { transform: scaleX(1); }

    /* ── Free-flow canvas ─────────────────────────────────────
       Full-bleed, pointer-drag panning only — no wheel handling, no
       zoom, no top copy. Tiles sit at fixed positions on a world larger
       than the viewport and are revealed by dragging around. */
    #pg-viewport {
      position: fixed; inset: 0; overflow: hidden; background: var(--paper);
      touch-action: none;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 30px 30px;
    }
    #pg-world {
      position: absolute; left: 0; top: 0; width: 2400px; height: 1500px;
      will-change: transform;
    }
    .pg-tile {
      position: absolute; overflow: hidden; background: var(--tile); text-decoration: none; display: block;
      border-radius: 6px; box-shadow: var(--tile-shadow); isolation: isolate;
    }
    .pg-tile img, .pg-tile iframe {
      width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(.08) saturate(.92) contrast(.96);
      transition: transform .55s cubic-bezier(.25,.46,.45,.94), filter .4s ease;
    }
    .pg-tile iframe { border: 0; pointer-events: none; background: transparent; }
    .pg-tile:hover img, .pg-tile:hover iframe { transform: scale(1.035); filter: grayscale(0) saturate(1.05) contrast(1.02); }

    #tile-interstellar { left: 260px; top: 200px; width: 460px; height: 460px; transform: rotate(-2deg); }
    #tile-animal-lib   { left: 980px; top: 520px; width: 520px; height: 340px; transform: rotate(1.4deg); }

    .grid-overlay {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.94);
      width: max-content; min-width: 190px; max-width: min(86%, 360px);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      padding: 9px 15px 11px; text-align: center; border-radius: 16px;
      border: 1px solid var(--label-border); background: var(--label-bg); color: var(--label-ink);
      box-shadow: var(--label-shadow); opacity: 0; pointer-events: none;
      transition: opacity .18s ease, transform .22s cubic-bezier(.22,1,.36,1);
      z-index: 2; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .pg-tile:hover .grid-overlay { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .item-name {
      display: block; max-width: 100%; font-size: clamp(14px, 1.18vw, 18px); font-weight: 600;
      letter-spacing: 0; line-height: 1.1; color: var(--label-ink); white-space: normal;
    }
    .item-subtitle {
      display: block; max-width: 100%; font-size: clamp(10px, .82vw, 12px); font-style: italic;
      color: var(--label-muted); line-height: 1.25;
    }

    #pg-hint {
      position: fixed; left: clamp(18px, 3vw, 42px); bottom: clamp(18px, 2.4vw, 30px); z-index: 60;
      font-size: 11px; font-style: italic; color: var(--muted); letter-spacing: .02em;
      pointer-events: none; user-select: none;
      opacity: 1; transition: opacity .4s ease;
    }
    #pg-hint.faded { opacity: 0; }

    /* Contact / resume footer — same treatment as work.html */
    .work-contact {
      position: fixed; right: 0; bottom: 0; z-index: 60;
      display: flex; justify-content: flex-end; align-items: flex-end; gap: 18px;
      padding: clamp(9px, 1.2vw, 16px) clamp(18px, 3vw, 42px);
    }
    .pixel-btn {
      font-family: 'Lora', Georgia, serif; font-size: 14px; letter-spacing: 0; color: var(--gray2);
      background: none; border: none; padding: 0; text-transform: lowercase; transition: color .15s;
      display: block; text-align: right;
    }
    .pixel-btn:hover { color: var(--ink); }
    .p-popup-overlay {
      position: fixed; inset: 0; z-index: 350;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.45);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .p-popup-box {
      background: #fff; min-width: 280px; max-width: 460px; width: 90%;
      padding: 48px 40px 40px; position: relative;
      box-shadow: 0 24px 64px rgba(0,0,0,.4); max-height: 90vh; overflow-y: auto;
    }
    .p-popup-close {
      position: absolute; top: 14px; right: 20px;
      font-family: 'VT323', monospace; font-size: 30px; line-height: 1;
      color: #222; background: none; border: none; opacity: .35; transition: opacity .15s;
    }
    .p-popup-close:hover { opacity: 1; }
    .p-popup-content {
      font-family: 'Lora', Georgia, serif; font-size: 15px; line-height: 1.75; color: #333; text-align: center;
    }
    .p-popup-content .contact-label {
      font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
      color: #999; margin-top: 20px; margin-bottom: 2px;
    }
    .p-popup-content .contact-label:first-child { margin-top: 0; }
    .p-popup-content a { color: #111; text-decoration: none; border-bottom: 1px solid #ccc; }
    .p-popup-content a:hover { border-bottom-color: #111; }

    @media (max-width: 900px) {
      #header { padding-left: 24px; padding-right: 24px; }
      #tile-interstellar { left: 140px; top: 160px; width: 320px; height: 320px; }
      #tile-animal-lib   { left: 560px; top: 420px; width: 340px; height: 230px; }
    }
    @media (max-width: 560px) {
      #header { padding-left: 18px; padding-right: 18px; }
      .h-nav { gap: 16px; }
      #tile-interstellar { left: 90px; top: 140px; width: 240px; height: 240px; }
      #tile-animal-lib   { left: 400px; top: 360px; width: 260px; height: 180px; }
      .grid-overlay { min-width: 140px; }
      .item-name { font-size: 13px; }
      .item-subtitle { font-size: 10px; }
    }
    @media (max-width: 600px) {
      .p-popup-box { padding: 36px 24px 28px; width: 94%; }
    }
    @media (pointer: coarse) {
      body { cursor: auto; }
      a, button, a:hover, button:hover { cursor: auto !important; }
      #cursor, #trail-canvas { display: none; }
      .grid-overlay { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
  </style>
  <script src="theme.js?v=20260506-restored-manifesto-panel"></script>

  <style id="force-cursor-none">
    html, body, html *, html *::before, html *::after,
    a, a:hover, a:active, a:focus, a:visited,
    button, button:hover, button:active, button:focus, button:disabled,
    input, input:hover, input:focus, input:active, input::placeholder,
    textarea, textarea:hover, textarea:focus, textarea:active,
    select, select:hover, select:focus,
    label, summary, details, [role="button"], [tabindex],
    iframe, img, video, canvas, svg, svg *,
    ::selection, ::-moz-selection,
    *:hover, *:active, *:focus, *:focus-visible, *:focus-within,
    *::before, *::after { cursor: none !important; }
  </style>
</head>
<body>
  <div id="safe-area-top"></div>
  <div id="cursor"></div>
  <div id="page-out"></div>
  <canvas id="trail-canvas"></canvas>

  <header id="header">
    <a class="h-name" href="Zaydan%20Kabir%20Amanullah.html" data-page="Zaydan%20Kabir%20Amanullah.html">Zaydan Kabir Amanullah</a>
    <nav class="h-nav">
      <a class="h-link" href="work.html" data-page="work.html">Work</a>
      <a class="h-link active" href="playground.html">Playground</a>
      <a class="h-link" href="index.html" data-page="index.html">About</a>
    </nav>
  </header>

  <div id="pg-viewport" aria-label="Free-flow playground canvas — drag to explore">
    <div id="pg-world">
      <a class="pg-tile" id="tile-interstellar" href="https://youtu.be/Q-NRXm59fLE" data-project-link="interstellar-automata" target="_blank" rel="noopener noreferrer" aria-label="Open Interstellar Automata video">
        <iframe data-src="interstellar-automata-hyperframe/index.html" title="Interstellar Automata animated preview" aria-hidden="true"></iframe>
        <div class="grid-overlay"><span class="item-name">Interstellar Automata</span><span class="item-subtitle">Product Design</span></div>
      </a>

      <a class="pg-tile" id="tile-animal-lib" href="https://stanfordpoliticalreview.org/2026/04/22/animal-liberation-indigeneity-and-morality/" target="_blank" rel="noopener noreferrer" data-project-link="animal-liberation" aria-label="Read Animal Liberation, Indigeneity, and Morality at Stanford Political Review">
        <iframe data-src="animal-liberation-hyperframe/index.html" title="Animal Liberation, Indigeneity, and Morality animated preview" aria-hidden="true"></iframe>
        <div class="grid-overlay"><span class="item-name">Animal Liberation, Indigeneity, and Morality</span><span class="item-subtitle">Stanford Political Review: Social Justice &amp; Law Paper</span></div>
      </a>
    </div>
  </div>

  <div id="pg-hint">drag to explore</div>

  <!-- ── Info / Contact / Resume ─────────────────────────── -->
  <footer class="work-contact">
    <button class="pixel-btn" id="work-btn-info">info</button>
    <button class="pixel-btn" id="work-btn-contact">contact</button>
    <button class="pixel-btn" id="work-btn-resume">resume</button>
  </footer>
  <div id="work-popup" class="p-popup-overlay" style="display:none">
    <div class="p-popup-box">
      <button class="p-popup-close" id="work-popup-close">X</button>
      <div class="p-popup-content" id="work-popup-content"></div>
    </div>
  </div>

  <script>
    // Info / Contact / Resume — mirrors the work page's popup.
    (function () {
      const popup = document.getElementById('work-popup');
      const txt = document.getElementById('work-popup-content');
      const open = html => { txt.innerHTML = html; popup.style.display = 'flex'; };
      document.getElementById('work-btn-info').addEventListener('click', () => open(
        `<p>Zaydan is an AI-native design engineer based in Stanford, California, whose work sits at the intersection of human-centered design, systems thinking, and social impact.</p>`
      ));
      document.getElementById('work-btn-contact').addEventListener('click', () => open(
        `<p class="contact-label">General Inquiries</p>
         <p><a href="mailto:zaydan1234@gmail.com">zaydan1234@gmail.com</a></p>
         <p class="contact-label">LinkedIn</p>
         <p><a href="https://www.linkedin.com/in/zaydanka" target="_blank" rel="noopener">Zaydan Kabir Amanullah</a></p>
         <p class="contact-label">Instagram</p>
         <p><a href="https://instagram.com/zaydanka.design" target="_blank" rel="noopener">@zaydanka.design</a></p>
         <p class="contact-label">Substack</p>
         <p><a href="https://zaydanamanullah.substack.com" target="_blank" rel="noopener">zaydanamanullah</a></p>`
      ));
      document.getElementById('work-btn-resume').addEventListener('click', () => {
        window.open('uploads/Design%20Resume.docx-3.pdf', '_blank', 'noopener');
      });
      document.getElementById('work-popup-close').addEventListener('click', () => { popup.style.display = 'none'; });
      popup.addEventListener('click', e => { if (e.target === popup) popup.style.display = 'none'; });
    })();
  </script>

  <script>
    const overlay = document.getElementById('page-out');
    overlay.classList.add('revealing');
    setTimeout(() => overlay.classList.remove('revealing'), 600);

    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top  = e.clientY + 'px';
    });

    const canvas = document.getElementById('trail-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = innerWidth; canvas.height = innerHeight;
    window.addEventListener('resize', () => { canvas.width = innerWidth; canvas.height = innerHeight; });
    const pts = [];
    document.addEventListener('mousemove', e => { pts.push({ x: e.clientX, y: e.clientY, t: Date.now() }); if (pts.length > 40) pts.shift(); });
    (function drawTrail() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const now = Date.now();
      const trailRgb = getComputedStyle(document.documentElement).getPropertyValue('--trail-rgb').trim() || '240,240,240';
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (let i = 1; i < pts.length; i++) {
        const age = (now - pts[i].t) / 300;
        const a = Math.max(0, 1 - age);
        ctx.beginPath(); ctx.moveTo(pts[i-1].x, pts[i-1].y); ctx.lineTo(pts[i].x, pts[i].y);
        ctx.strokeStyle = `rgba(${trailRgb},${a * 0.34})`; ctx.lineWidth = (i / pts.length) * 2.5; ctx.stroke();
      }
      while (pts.length && now - pts[0].t > 300) pts.shift();
      requestAnimationFrame(drawTrail);
    })();

    document.querySelectorAll('a[data-page]').forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        overlay.classList.add('covering');
        setTimeout(() => { window.location.href = link.getAttribute('href'); }, 460);
      });
    });
  </script>

  <script>
    // Defer hyperframe iframes until the page has settled, same as work.html.
    (function () {
      function activateHyperframes() {
        document.querySelectorAll('iframe[data-src]').forEach(function (f) {
          var s = f.getAttribute('data-src');
          if (s) { f.setAttribute('src', s); f.removeAttribute('data-src'); }
        });
      }
      if (document.readyState === 'complete') {
        activateHyperframes();
      } else {
        window.addEventListener('load', activateHyperframes, { once: true });
      }
    })();
  </script>

  <script>
    // Free-flow canvas: pointer-drag panning only (no wheel/zoom, no scroll).
    // Tiles remain clickable — a drag is only treated as a pan once it moves
    // past a small threshold, so a plain click still opens the tile's link.
    (function () {
      const viewport = document.getElementById('pg-viewport');
      const world = document.getElementById('pg-world');
      const hint = document.getElementById('pg-hint');
      const tiles = Array.from(document.querySelectorAll('.pg-tile'));
      const MARGIN = 200;

      let panX = 0, panY = 0;
      let isPanning = false, dragged = false;
      let startX = 0, startY = 0, startPanX = 0, startPanY = 0;
      let activePointerId = null;

      function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

      // Measured from the tiles themselves (not a fixed world size) so
      // centering/clamping stays correct across the responsive breakpoints
      // that reposition the tiles.
      function getContentBounds() {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        tiles.forEach(t => {
          minX = Math.min(minX, t.offsetLeft);
          minY = Math.min(minY, t.offsetTop);
          maxX = Math.max(maxX, t.offsetLeft + t.offsetWidth);
          maxY = Math.max(maxY, t.offsetTop + t.offsetHeight);
        });
        return { minX, minY, maxX, maxY };
      }

      function clampPan() {
        const vw = viewport.clientWidth, vh = viewport.clientHeight;
        const b = getContentBounds();
        panX = clamp(panX, -MARGIN - b.maxX, vw + MARGIN - b.minX);
        panY = clamp(panY, -MARGIN - b.maxY, vh + MARGIN - b.minY);
      }

      function applyPan() {
        world.style.transform = `translate(${panX}px, ${panY}px)`;
      }

      function centerInitial() {
        const vw = viewport.clientWidth, vh = viewport.clientHeight;
        const b = getContentBounds();
        panX = vw / 2 - (b.minX + b.maxX) / 2;
        panY = vh / 2 - (b.minY + b.maxY) / 2;
        clampPan();
        applyPan();
      }
      centerInitial();
      window.addEventListener('resize', centerInitial);

      viewport.addEventListener('pointerdown', e => {
        isPanning = true;
        dragged = false;
        activePointerId = e.pointerId;
        startX = e.clientX; startY = e.clientY;
        startPanX = panX; startPanY = panY;
        viewport.setPointerCapture(e.pointerId);
      });

      viewport.addEventListener('pointermove', e => {
        if (!isPanning || e.pointerId !== activePointerId) return;
        const dx = e.clientX - startX, dy = e.clientY - startY;
        if (!dragged && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
          dragged = true;
          hint.classList.add('faded');
        }
        if (dragged) {
          panX = startPanX + dx;
          panY = startPanY + dy;
          clampPan();
          applyPan();
        }
      });

      function endPan(e) {
        if (e.pointerId !== activePointerId) return;
        isPanning = false;
        activePointerId = null;
      }
      viewport.addEventListener('pointerup', endPan);
      viewport.addEventListener('pointercancel', endPan);

      // Swallow the click that follows a drag so tiles don't navigate
      // when the user was just panning the canvas.
      viewport.addEventListener('click', e => {
        if (dragged) {
          e.preventDefault();
          e.stopPropagation();
          dragged = false;
        }
      }, true);
    })();
  </script>
